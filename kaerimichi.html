<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>帰り道</title>
<style>
  :root{
    --ink:#e8e6e1;
    --dim:#8e8b85;
    /* 唯一の色みは、街灯のナトリウム灯の色 */
    --lamp:#ffd39a;
    --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--jp)}
  canvas{display:block;width:100%;height:100%}
  #wrap{position:fixed;inset:0}

  /* ---- film grain + vignette ---- */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse 78% 68% at 50% 50%,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.88) 100%);}
  #grain{position:fixed;inset:-100px;pointer-events:none;z-index:6;opacity:.055;background-repeat:repeat;will-change:transform}

  /* ---- fade ---- */
  #fade{position:fixed;inset:0;background:#000;z-index:20;pointer-events:none;opacity:1;transition:opacity 1s linear}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:8}
  /* 目的表示。どんな明るさの背景でも読めるよう、暗い下地と灯り色の縦線を付ける */
  #obj{position:absolute;left:30px;top:26px;font-size:18px;letter-spacing:.14em;
    color:#f2efe8;background:rgba(6,7,10,.62);border-left:3px solid var(--lamp);
    padding:11px 20px 12px 15px;border-radius:0 3px 3px 0;
    text-shadow:0 1px 10px #000;opacity:0;transition:opacity .8s}
  #obj.on{opacity:1}
  #obj b{display:block;font-size:12px;letter-spacing:.3em;color:var(--lamp);
    font-weight:400;margin-bottom:6px;opacity:.9}
  #cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
    background:rgba(255,255,255,.32);transition:all .16s ease-out}
  #cross.hot{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:transparent;border:1px solid rgba(255,255,255,.8)}
  #prompt{position:absolute;left:50%;top:calc(50% + 42px);transform:translateX(-50%);font-size:19px;letter-spacing:.14em;
    opacity:0;transition:opacity .18s;text-shadow:0 1px 8px #000;white-space:nowrap}
  #prompt.on{opacity:.92}
  #prompt kbd{display:inline-block;border:1px solid rgba(255,255,255,.55);border-radius:3px;padding:1px 6px;
    margin-right:10px;font-family:var(--jp);font-size:15px}
  #sub{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);max-width:82%;text-align:center;
    font-size:23px;line-height:1.85;letter-spacing:.1em;text-shadow:0 2px 12px #000,0 0 24px #000;opacity:0;
    transition:opacity 1s;white-space:pre-line}
  #sub.on{opacity:1}

  /* ---- screens ---- */
  .screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#000;text-align:center;gap:0;transition:opacity .9s}
  .screen.hide{opacity:0;pointer-events:none}
  .screen.gone{display:none}
  /* タイトルの奥に、遠くの街灯くらいの灯りをひとつ置く */
  #title::before{content:"";position:absolute;left:50%;top:38%;width:min(70vw,620px);height:min(70vw,620px);
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle,rgba(255,211,154,.13) 0%,rgba(255,211,154,.045) 32%,rgba(255,211,154,0) 68%)}
  #title>*{position:relative}
  #title h1{font-size:min(13vw,86px);letter-spacing:.42em;font-weight:400;text-indent:.42em;
    text-shadow:0 0 46px rgba(255,211,154,.20),0 0 90px rgba(255,211,154,.10)}
  #title .sub{margin-top:18px;font-size:13px;letter-spacing:.55em;color:#565350;text-indent:.55em}
  #title .keys{margin-top:64px;font-size:15px;line-height:2.3;color:#6d6a65;letter-spacing:.1em}
  #title .keys span{color:#b9b6b0}
  .btn{margin-top:52px;pointer-events:auto;cursor:pointer;background:none;color:var(--ink);
    border:1px solid rgba(255,255,255,.28);padding:14px 46px;font-family:var(--jp);font-size:17px;
    letter-spacing:.4em;text-indent:.4em;transition:.35s}
  .btn:hover,.btn:focus-visible{background:rgba(255,211,154,.06);border-color:rgba(255,211,154,.65);
    color:var(--lamp);letter-spacing:.55em;outline:none}
  .btn[disabled]{opacity:.3;cursor:default}
  #warn{margin-top:34px;font-size:13px;color:#4e4b47;letter-spacing:.2em;line-height:2}

  /* ---- pause ---- */
  #pause{background:rgba(0,0,0,.9)}
  #pause h2{font-size:24px;letter-spacing:.5em;text-indent:.5em;color:#cfccc6;font-weight:400;margin-bottom:40px}
  .row{pointer-events:auto;display:flex;align-items:center;gap:16px;margin:11px 0;font-size:15px;
    letter-spacing:.16em;color:#8e8b85}
  .row label{width:120px;text-align:right}
  .row input[type=range]{width:190px;accent-color:#b6b2ab}
  .row output{width:44px;text-align:left;color:#cfccc6}

  /* ---- end ---- */
  #end h1{font-size:min(9vw,54px);letter-spacing:.6em;text-indent:.6em;font-weight:400;opacity:.92}
  #end .cap{margin-top:26px;font-size:15px;letter-spacing:.34em;color:#4f4c48}

  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9;font-size:14px;
    letter-spacing:.2em;color:#55524e;opacity:0;transition:opacity .7s;pointer-events:none}
  #hint.on{opacity:1}

  /* ---- タッチ操作（スマホ・タブレット） ---- */
  html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  #wrap,canvas{touch-action:none}
  body:not(.touch) .touchonly{display:none}
  body.touch .kbdonly{display:none}
  body.touch #prompt kbd{display:none}
  /* 左半分の仮想スティック。指を置いた場所に出る */
  #stick{position:fixed;z-index:9;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);
    pointer-events:none;opacity:0;transition:opacity .2s}
  #stick.on{opacity:1}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
  #act,#menu{position:fixed;z-index:10;pointer-events:auto;cursor:pointer;
    font-family:var(--jp);color:var(--ink);background:rgba(8,9,12,.5);
    border:1px solid rgba(255,255,255,.45);text-shadow:0 1px 8px #000;display:none}
  #act{right:24px;bottom:calc(28px + env(safe-area-inset-bottom));width:94px;height:94px;border-radius:50%;
    font-size:15px;letter-spacing:.1em;line-height:1.4;padding:0 6px;align-items:center;justify-content:center}
  #act.on{display:flex}
  #act:active{background:rgba(255,211,154,.18);border-color:var(--lamp);color:var(--lamp)}
  #menu{right:16px;top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:4px;
    border-color:rgba(255,255,255,.22);font-size:17px}
  body.touch #menu{display:block}
  body.paused #menu,body.paused #act{display:none}   /* 中断画面に透けて見えないように */
  /* 狭い画面ではHUDを詰める */
  @media (max-width:820px){
    #obj{left:14px;top:14px;font-size:15px;padding:9px 14px 10px 11px}
    #obj b{font-size:10px;letter-spacing:.24em}
    #sub{font-size:18px;line-height:1.7;bottom:16%;max-width:88%}
    #prompt{font-size:16px;top:calc(50% + 34px)}
    #hint{font-size:12px;bottom:18px}
    #title h1{font-size:min(17vw,86px)}
    #title .keys{margin-top:38px;font-size:13px;line-height:2.1}
    .btn{margin-top:36px;padding:13px 34px;font-size:16px;letter-spacing:.3em;text-indent:.3em}
    #warn{margin-top:24px;font-size:12px;line-height:1.9}
    #pause h2{margin-bottom:26px}
    .row{font-size:13px;gap:10px;margin:9px 0}
    .row label{width:82px}
    .row input[type=range]{width:132px}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="vig"></div>
<div id="grain"></div>

<div id="hud">
  <div id="obj"><b>もくてき</b><i id="objt" style="font-style:normal"></i></div>
  <div id="cross"></div>
  <div id="prompt"><kbd>E</kbd><span id="promptt">調べる</span></div>
  <div id="sub"></div>
</div>
<div id="hint"></div>
<!-- タッチ操作のUI。#hud は pointer-events:none なので外に出す -->
<div id="stick"><div id="knob"></div></div>
<button id="act">調べる</button>
<button id="menu" aria-label="中断">☰</button>
<div id="fade"></div>

<div class="screen" id="title">
  <h1>帰り道</h1>
  <div class="sub">A SHORT WALK HOME</div>
  <div class="keys kbdonly">
    <span>W A S D</span> ／ 移動　　<span>マウス</span> ／ 視点<br>
    <span>Shift</span> ／ 急ぐ　　<span>E</span> ／ 調べる　　<span>Esc</span> ／ 中断
  </div>
  <div class="keys touchonly">
    <span>左半分</span> ／ 移動（深く倒すと急ぐ）<br>
    <span>右半分をなぞる</span> ／ 視点　　<span>調べる</span> ／ 調べる<br>
    <span>☰</span> ／ 中断
  </div>
  <button class="btn" id="startBtn" disabled>準備中…</button>
  <div id="warn">ヘッドホン と 暗い部屋 を推奨します<br>大きな音が鳴る場面があります</div>
</div>

<div class="screen gone" id="pause">
  <h2>中断中</h2>
  <div class="row"><label>音量</label><input type="range" id="sVol" min="0" max="100" value="80"><output id="oVol">80</output></div>
  <div class="row"><label>虫の声</label><input type="range" id="sBug" min="0" max="100" value="35"><output id="oBug">35</output></div>
  <div class="row"><label>明るさ</label><input type="range" id="sGam" min="50" max="180" value="100"><output id="oGam">100</output></div>
  <div class="row"><label>視点感度</label><input type="range" id="sSens" min="20" max="300" value="100"><output id="oSens">100</output></div>
  <button class="btn" id="resumeBtn">つづける</button>
</div>

<div class="screen gone" id="end">
  <h1 id="endt">帰り道</h1>
  <div class="cap">おわり</div>
  <button class="btn" id="againBtn">もういちど歩く</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =========================================================================
   0. UTIL
   ========================================================================= */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const smoothstep=t=>t*t*(3-2*t);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RND=mulberry(0x51ee7);
const rr=(a,b)=>a+RND()*(b-a);
const ri=(a,b)=>Math.floor(a+RND()*(b-a+1));
const pick=a=>a[Math.floor(RND()*a.length)];
const $=id=>document.getElementById(id);

/* =========================================================================
   1. PROCEDURAL TEXTURES  (画像ファイルを一切使わず canvas で生成)
   ========================================================================= */
const TEX={};
(function(){
  function cv(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c;}
  function tex(w,h,draw,rx,ry){
    const c=cv(w,h),x=c.getContext("2d");draw(x,w,h);
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(rx||1,ry||1);
    t.anisotropy=8; t.encoding=THREE.sRGBEncoding;
    return t;
  }
  function grain(x,w,h,n,min,max,alpha){
    for(let i=0;i<n;i++){
      const g=Math.floor(rr(min,max));
      x.fillStyle="rgba("+g+","+g+","+g+","+(alpha||1)+")";
      x.fillRect(RND()*w|0,RND()*h|0,rr(1,2.4),rr(1,2.4));
    }
  }
  function blob(x,w,h,n,col,rmin,rmax,a){
    for(let i=0;i<n;i++){
      const cx=RND()*w,cy=RND()*h,r=rr(rmin,rmax);
      const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,"rgba("+col+","+a+")");g.addColorStop(1,"rgba("+col+",0)");
      x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);
    }
  }
  const JPFONT='"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo",sans-serif';

  /* --- アスファルト --- */
  TEX.asphalt=tex(512,512,(x,w,h)=>{
    x.fillStyle="#3a3b3d";x.fillRect(0,0,w,h);
    grain(x,w,h,26000,28,86,.85);
    grain(x,w,h,5000,90,130,.5);
    blob(x,w,h,26,"22,22,24",40,120,.5);
    blob(x,w,h,14,"78,78,80",30,90,.25);
    x.strokeStyle="rgba(20,20,22,.75)";
    for(let i=0;i<9;i++){
      x.lineWidth=rr(.6,2);x.beginPath();
      let px=RND()*w,py=RND()*h;x.moveTo(px,py);
      for(let j=0;j<12;j++){px+=rr(-38,38);py+=rr(-38,38);x.lineTo(px,py);}
      x.stroke();
    }
  });

  /* --- 側溝／コンクリート --- */
  TEX.gutter=tex(256,256,(x,w,h)=>{
    x.fillStyle="#54534e";x.fillRect(0,0,w,h);
    grain(x,w,h,9000,58,110,.7);
    blob(x,w,h,16,"40,42,38",22,64,.5);
    x.strokeStyle="rgba(34,34,32,.8)";x.lineWidth=3;
    for(let y=0;y<h;y+=64){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();}
  });

  /* --- ブロック塀 --- */
  TEX.block=tex(256,256,(x,w,h)=>{
    x.fillStyle="#6a675f";x.fillRect(0,0,w,h);
    const bw=128,bh=64;
    for(let r=0,y=0;y<h;y+=bh,r++){
      for(let px=-((r%2)*bw/2);px<w;px+=bw){
        x.fillStyle="rgb("+Math.floor(rr(96,116))+","+Math.floor(rr(94,112))+","+Math.floor(rr(86,102))+")";
        x.fillRect(px+2,y+2,bw-4,bh-4);
        x.fillStyle="rgba(48,48,44,.45)";
        x.beginPath();x.arc(px+bw*.3,y+bh*.5,9,0,7);x.fill();
        x.beginPath();x.arc(px+bw*.7,y+bh*.5,9,0,7);x.fill();
      }
    }
    grain(x,w,h,12000,60,140,.35);
    blob(x,w,h,20,"48,46,40",20,70,.45);
    blob(x,w,h,10,"30,36,28",16,50,.4);
  });

  /* --- モルタル外壁 --- */
  TEX.mortar=tex(256,256,(x,w,h)=>{
    x.fillStyle="#8f8a80";x.fillRect(0,0,w,h);
    grain(x,w,h,20000,110,165,.5);
    blob(x,w,h,26,"92,88,80",26,80,.45);
    blob(x,w,h,10,"64,62,56",30,80,.3);
  });

  /* --- サイディング（横板張り） --- */
  TEX.siding=tex(256,256,(x,w,h)=>{
    x.fillStyle="#9a938a";x.fillRect(0,0,w,h);
    grain(x,w,h,9000,120,170,.35);
    for(let y=0;y<h;y+=32){
      const g=x.createLinearGradient(0,y,0,y+32);
      g.addColorStop(0,"rgba(255,255,255,.10)");
      g.addColorStop(.82,"rgba(0,0,0,0)");
      g.addColorStop(1,"rgba(0,0,0,.42)");
      x.fillStyle=g;x.fillRect(0,y,w,32);
    }
    blob(x,w,h,12,"70,66,60",24,66,.3);
  });

  /* --- トタン波板 --- */
  TEX.tin=tex(128,128,(x,w,h)=>{
    for(let px=0;px<w;px+=16){
      const g=x.createLinearGradient(px,0,px+16,0);
      g.addColorStop(0,"#3d4a4c");g.addColorStop(.42,"#6d7c7d");g.addColorStop(1,"#33403f");
      x.fillStyle=g;x.fillRect(px,0,16,h);
    }
    blob(x,w,h,22,"110,62,30",8,30,.55);
    grain(x,w,h,3000,60,120,.3);
  });

  /* --- 瓦屋根 --- */
  TEX.roof=tex(256,256,(x,w,h)=>{
    x.fillStyle="#31373f";x.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32){
      for(let px=0;px<w;px+=32){
        const g=x.createLinearGradient(px,y,px+32,y);
        g.addColorStop(0,"#232830");g.addColorStop(.4,"#49525d");g.addColorStop(1,"#20242b");
        x.fillStyle=g;x.beginPath();x.moveTo(px,y+32);x.lineTo(px,y+8);
        x.quadraticCurveTo(px+16,y-6,px+32,y+8);x.lineTo(px+32,y+32);x.closePath();x.fill();
      }
    }
    grain(x,w,h,5000,40,90,.35);
  });

  /* --- 畳 --- */
  TEX.tatami=tex(256,256,(x,w,h)=>{
    x.fillStyle="#8d8a5c";x.fillRect(0,0,w,h);
    x.strokeStyle="rgba(120,116,74,.85)";x.lineWidth=1;
    for(let y=0;y<h;y+=3){x.beginPath();x.moveTo(0,y+Math.sin(y*.4)*.6);x.lineTo(w,y);x.stroke();}
    x.strokeStyle="rgba(160,156,110,.35)";
    for(let px=0;px<w;px+=4){x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke();}
    blob(x,w,h,14,"104,100,64",26,80,.45);
    x.fillStyle="#2f3038";x.fillRect(0,0,w,7);x.fillRect(0,h-7,w,7);
  });

  /* --- 板張り床 --- */
  TEX.wood=tex(256,256,(x,w,h)=>{
    x.fillStyle="#6b5945";x.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=42){
      for(let px=0;px<w;px+=110){
        x.fillStyle="rgb("+Math.floor(rr(88,118))+","+Math.floor(rr(70,94))+","+Math.floor(rr(52,70))+")";
        x.fillRect(px,y,100,40);
        x.strokeStyle="rgba(40,30,22,.7)";x.lineWidth=1.4;x.strokeRect(px,y,100,40);
        x.strokeStyle="rgba(60,46,34,.35)";
        for(let k=0;k<4;k++){const yy=y+rr(4,36);x.beginPath();x.moveTo(px,yy);
          x.bezierCurveTo(px+30,yy+rr(-3,3),px+60,yy+rr(-3,3),px+100,yy+rr(-2,2));x.stroke();}
      }
    }
    grain(x,w,h,4000,60,110,.25);
  });

  /* --- 砂利 --- */
  TEX.gravel=tex(256,256,(x,w,h)=>{
    x.fillStyle="#2e2c28";x.fillRect(0,0,w,h);
    for(let i=0;i<7000;i++){
      const g=Math.floor(rr(40,105));
      x.fillStyle="rgb("+g+","+(g-2)+","+(g-6)+")";
      x.beginPath();x.arc(RND()*w,RND()*h,rr(.7,2.6),0,7);x.fill();
    }
    blob(x,w,h,20,"20,22,18",24,72,.5);
  });

  /* --- 土／雑草混じり --- */
  TEX.dirt=tex(256,256,(x,w,h)=>{
    x.fillStyle="#2a2a22";x.fillRect(0,0,w,h);
    grain(x,w,h,16000,28,66,.7);
    blob(x,w,h,26,"36,46,28",22,74,.45);
    blob(x,w,h,14,"18,18,14",30,84,.5);
  });

  /* --- カーテン（縦のひだ） --- */
  TEX.curtain=tex(128,256,(x,w,h)=>{
    x.fillStyle="#8b8f99";x.fillRect(0,0,w,h);
    for(let px=0;px<w;px+=16){
      const g=x.createLinearGradient(px,0,px+16,0);
      g.addColorStop(0,"rgba(0,0,0,.46)");
      g.addColorStop(.45,"rgba(255,255,255,.16)");
      g.addColorStop(1,"rgba(0,0,0,.40)");
      x.fillStyle=g;x.fillRect(px,0,16,h);
    }
    grain(x,w,h,3000,110,160,.22);
  });

  /* --- コンビニ床（明るいタイル） --- */
  TEX.storefloor=tex(256,256,(x,w,h)=>{
    x.fillStyle="#d9d6cd";x.fillRect(0,0,w,h);
    grain(x,w,h,6000,190,232,.4);

      modal (d,sr,.002,[[rr(96,140),.060,.34],[rr(255,360),.035,.16]],.32); // 床鳴り
    },.40));

    /* ★ コンコン ★ — このゲームの主役の音 */
    function konAt(d,sr,t0,g,det){
      det=det||1;
      nburst(d,sr,t0,.012,.55*g,4200,10,true);
      modal(d,sr,t0,[
        [372*det,.085,1.0],[516*det,.062,.55],[905*det,.040,.30],
        [1410*det,.022,.16],[2260*det,.014,.08],[94,.13,.85]
      ],g);
    }
    B.knock2=makeOne(1.1,1,(t,sr)=>{const d=t[0];konAt(d,sr,.02,1,1);konAt(d,sr,.30,.86,1.012);},.72);
    B.knock3=makeOne(1.5,1,(t,sr)=>{const d=t[0];konAt(d,sr,.02,1,1);konAt(d,sr,.28,.9,1.01);konAt(d,sr,.55,.8,.994);},.75);
    B.knockNear=makeOne(1.2,1,(t,sr)=>{const d=t[0];konAt(d,sr,.02,1,.985);konAt(d,sr,.33,.95,1.005);},.95);
    B.knockSlow=makeOne(2.4,1,(t,sr)=>{const d=t[0];konAt(d,sr,.02,1,.97);konAt(d,sr,.62,.92,.975);},.8);

    /* ブランコの軋み（1周期ぶん）。往復の端でそれぞれ一度きしむ */
    B.swing=makeLoop(2.7,1,(t,sr,N)=>{
      const d=t[0];
      creak(d,sr,.05,.52,38,104,.60,1.00);
      creak(d,sr,1.36,.48,34,96,.52,.93);
      // 錆びた鎖のかちゃかちゃ
      for(let j=0;j<7;j++)nburst(d,sr,rr(.05,.55),.022,.085,5200,18,true);
      for(let j=0;j<7;j++)nburst(d,sr,rr(1.36,1.92),.022,.075,5000,18,true);
    },.35,.42);

    /* 粘っこい液体が落ちる音
       純正弦のスイープは「ピコッ」という電子音そのものになるので使わない。
       べちゃっという広帯域のノイズを主役にして、響きはごく短く添えるだけ。 */
    B.drip=[];
    for(let k=0;k<4;k++)B.drip.push(makeOne(.45,1,(t,sr)=>{
      const d=t[0];
      nburst(d,sr,0   ,.040,1.00,rr(1500,3000),13,true);   // 着弾
      nburst(d,sr,.002,.105,.60,rr(360,820)  ,8,false,.08); // 粘り
      // わずかな響き（倍音を非整数にして音程感を濁らせる）
      const n=Math.floor(.10*sr),f0=rr(230,330),f1=rr(400,560);
      let ph=0;
      for(let i=0;i<n;i++){
        const tt=i/sr;
        ph+=2*Math.PI*(f0+(f1-f0)*(1-Math.exp(-tt/.022)))/sr;
        d[i]+=.30*Math.exp(-tt/.028)
              *(Math.sin(ph)*.62+Math.sin(ph*2.73)*.26+Math.sin(ph*4.17)*.12)
              *(1+.07*(Math.random()-.5));
      }
    },.40));

    /* 袋の中で何かが動く */
    B.squelch=makeOne(1.4,1,(t,sr)=>{
      const d=t[0];
      for(let j=0;j<34;j++)                       // ぬちゃっとした擦れ
        nburst(d,sr,rr(0,.9),rr(.03,.14),rr(.12,.45),rr(260,1200),rr(4,9),false,.25);
      for(let j=0;j<14;j++)                       // ビニールのこすれ
        nburst(d,sr,rr(.05,.95),rr(.01,.04),rr(.08,.22),rr(2600,7000),14,true);
      modal(d,sr,.06,[[58,.09,.55],[86,.06,.30]],.42);   // 低い軋み（長く伸ばさない）
    },.5);

    /* 建具 */
    B.creak=makeOne(1.6,1,(t,sr)=>{      // 玄関ドアの蝶番
      const d=t[0];
      creak(d,sr,.05,1.15,17,42,.62,.50);
      nburst(d,sr,0,1.15,.05,420,3,false,.25);
    },.5);
    B.latch=makeOne(.35,1,(t,sr)=>{
      const d=t[0];
      modal(d,sr,0,[[1750,.012,1],[2900,.008,.5],[430,.03,.5]],.8);
      modal(d,sr,.11,[[1420,.016,.8],[380,.04,.6]],.7);
    },.62);
    B.keys=makeOne(1.4,1,(t,sr)=>{
      const d=t[0];
      for(let j=0;j<9;j++)modal(d,sr,rr(0,.8),[[rr(2200,4600),.05,1],[rr(4800,7200),.03,.5]],rr(.2,.5));
    },.45);
    B.slide=makeOne(1.6,1,(t,sr)=>{ // 襖・引戸
      const d=t[0],n=Math.floor(1.1*sr);
      let lp=0;
      for(let i=0;i<n;i++){
        const p=i/n;lp=lp*.9+nz()*.1;
        d[i]+=lp*Math.sin(Math.PI*p)*(.5+.5*Math.sin(2*Math.PI*33*(i/sr)))*.9;
      }
      modal(d,sr,1.08,[[140,.09,1],[300,.05,.4]],.6);
    },.48);
    B.fridge=makeOne(1.4,1,(t,sr)=>{
      const d=t[0];
      nburst(d,sr,0,.16,1,420,7);
      modal(d,sr,.02,[[64,.14,.9],[128,.08,.35]],.6);
      nburst(d,sr,.18,.9,.10,2400,2,true);
    },.55);
    B.chime=makeOne(1.6,1,(t,sr)=>{ // コンビニ入店音
      const d=t[0],mk=(t0,f)=>{
        const n=Math.floor(.55*sr);
        for(let i=0;i<n;i++){
          const idx=Math.floor(t0*sr)+i;if(idx>=d.length)break;
          const tt=i/sr,env=Math.min(1,tt/.012)*Math.exp(-tt/.19);
          d[idx]+=env*(Math.sin(2*Math.PI*f*tt)+.3*Math.sin(2*Math.PI*f*2*tt));
        }
      };
      mk(0,784);mk(.42,588);
    },.42);
    B.canDrop=makeOne(1.6,1,(t,sr)=>{
      const d=t[0];
      nburst(d,sr,0,.3,.3,1800,6,true);
      modal(d,sr,.30,[[210,.12,1],[520,.07,.4],[930,.04,.2]],.7);
      modal(d,sr,.52,[[240,.09,.6],[610,.05,.3]],.5);
      modal(d,sr,.70,[[200,.14,.8],[80,.16,.6]],.6);
    },.6);
    B.coin=makeOne(1.2,1,(t,sr)=>{
      const d=t[0];
      for(let j=0;j<5;j++)modal(d,sr,rr(0,.55),[[rr(3000,5200),.09,1],[rr(6000,8800),.05,.4]],rr(.2,.45));
    },.42);
    B.click=makeOne(.16,1,(t,sr)=>{
      const d=t[0];
      modal(d,sr,0,[[2400,.008,1],[900,.014,.6],[320,.02,.4]],.8);
    },.5);
    B.wrapper=makeOne(1.1,1,(t,sr)=>{
      const d=t[0];
      for(let j=0;j<40;j++)nburst(d,sr,rr(0,.85),rr(.008,.03),rr(.2,.8),rr(3000,9000),12,true);
    },.35);

    /* 遠くを通る車 */
    B.carPass=makeLoop(9,2,(t,sr,N)=>{
      const L=t[0],Rc=t[1];
      let lp=0,lp2=0,b=0;
      for(let i=0;i<N;i++){
        const tt=i/sr,p=tt/(N/sr);
        b=(b+.05*nz())*.996;
        lp=lp*.985+b*.015; lp2=lp2*.96+lp*.04;
        const env=Math.exp(-Math.pow((p-.5)/.19,2))*1.0;
        const pan=(p-.5)*1.9;
        const pl=Math.sqrt(clamp((1-pan)/2,0,1)),pr=Math.sqrt(clamp((1+pan)/2,0,1));
        const s=(lp2*2.4+Math.sin(2*Math.PI*(52+18*p)*tt)*.12)*env;
        L[i]+=s*pl;Rc[i]+=s*pr;
      }
    },0,.3);

    /* 低い持続音（最終盤） */
    B.sub=makeLoop(8,1,(t,sr,N)=>{
      const d=t[0];let lp=0;
      for(let i=0;i<N;i++){
        const tt=i/sr;
        lp=lp*.9975+nz()*.0025;
        d[i]=Math.sin(2*Math.PI*36*tt)*.6+Math.sin(2*Math.PI*54.3*tt)*.3
            +Math.sin(2*Math.PI*27*tt)*.35+lp*2.2;
      }
    },1.5,.5);

    /* 心音 */
    B.heart=makeLoop(1.35,1,(t,sr)=>{
      const d=t[0];
      modal(d,sr,.02,[[52,.10,1],[78,.06,.4]],.9);
      modal(d,sr,.30,[[48,.09,.75],[72,.05,.3]],.7);
    },.15,.55);

    /* 引き込まれる時の上昇音 */
    B.whoosh=makeOne(4,1,(t,sr,N)=>{
      const d=t[0];let lp=0,b=0;
      for(let i=0;i<N;i++){
        const p=i/N;
        b=(b+.05*nz())*.996;
        const c=Math.exp(-2*Math.PI*(80+2600*p*p)/sr);
        lp=b*(1-c)+lp*c;
        d[i]=lp*Math.pow(p,1.6)*6+Math.sin(2*Math.PI*(28+22*p)*(i/sr))*Math.pow(p,2)*.5;
      }
    },.65);

    /* 終幕の低い鐘 */
    B.endTone=makeOne(6,1,(t,sr)=>{
      const d=t[0];
      modal(d,sr,0,[[73,3.2,1],[110,2.4,.42],[164,1.6,.2],[221,1.1,.12],[42,3.6,.5]],.55);
    },.5);
  }

  /* ---------- 再生系 ---------- */
  function setPos(node,p){
    if(node.positionX){node.positionX.value=p.x;node.positionY.value=p.y;node.positionZ.value=p.z;}
    else node.setPosition(p.x,p.y,p.z);
  }
  function mkPanner(pos,opt){
    const p=ctx.createPanner();
    p.panningModel=opt.hrtf===false?"equalpower":"HRTF";
    p.distanceModel="exponential";
    p.refDistance=opt.ref||2.2;
    p.rolloffFactor=opt.roll||1.7;
    p.maxDistance=300;
    setPos(p,pos);
    return p;
  }

  SND.init=function(){
    ctx=THREE.AudioContext.getContext();
    SND.ctx=ctx;
    comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-14;comp.knee.value=22;comp.ratio.value=3.2;
    comp.attack.value=.004;comp.release.value=.26;
    master=ctx.createGain();master.gain.value=.8;
    duckGain=ctx.createGain();duckGain.gain.value=1;
    busAmb=ctx.createGain();busAmb.gain.value=1;
    busSfx=ctx.createGain();busSfx.gain.value=1;
    busAmb.connect(duckGain);busSfx.connect(duckGain);
    duckGain.connect(master);master.connect(comp);comp.connect(ctx.destination);
    build();
    SND.ready=true;
  };

  SND.resume=function(){ if(ctx&&ctx.state!=="running")ctx.resume(); };
  SND.setVolume=function(v){ if(master)master.gain.value=v; };
  SND.duck=function(v,tm){
    if(!duckGain)return;
    const t=ctx.currentTime;
    duckGain.gain.cancelScheduledValues(t);
    duckGain.gain.setValueAtTime(duckGain.gain.value,t);
    duckGain.gain.linearRampToValueAtTime(v,t+(tm||.4));
  };

  // 単発
  SND.play=function(key,opt){
    if(!SND.ready)return null;
    opt=opt||{};
    let buf=B[key];
    if(Array.isArray(buf))buf=buf[Math.floor(Math.random()*buf.length)];
    if(!buf)return null;
    const src=ctx.createBufferSource();
    src.buffer=buf;
    src.playbackRate.value=opt.rate||1;
    const g=ctx.createGain();
    g.gain.value=opt.vol==null?1:opt.vol;
    src.connect(g);
    const bus=opt.amb?busAmb:busSfx;
    if(opt.pos){const p=mkPanner(opt.pos,opt);g.connect(p);p.connect(bus);}
    else if(opt.pan!=null&&ctx.createStereoPanner){
      const sp=ctx.createStereoPanner();
      sp.pan.value=clamp(opt.pan,-1,1);
      g.connect(sp);sp.connect(bus);
    }
    else g.connect(bus);
    src.start(ctx.currentTime+(opt.delay||0));
    return src;
  };

  // ループ（ハンドルを返す）
  SND.loop=function(key,opt){
    if(!SND.ready)return null;
    opt=opt||{};
    const buf=B[key];if(!buf)return null;
    const src=ctx.createBufferSource();
    src.buffer=buf;src.loop=true;src.playbackRate.value=opt.rate||1;
    const g=ctx.createGain();g.gain.value=opt.vol==null?1:opt.vol;
    let pan=null;
    src.connect(g);
    if(opt.pos){pan=mkPanner(opt.pos,opt);g.connect(pan);pan.connect(opt.amb?busAmb:busSfx);}
    else g.connect(opt.amb?busAmb:busSfx);
    src.start(0);
    const h={
      src:src,gain:g,panner:pan,
      vol:function(v,tm){
        const t=ctx.currentTime;
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value,t);
        g.gain.linearRampToValueAtTime(v,t+(tm==null?.3:tm));
        return h;
      },
      rate:function(v,tm){
        const t=ctx.currentTime;
        src.playbackRate.cancelScheduledValues(t);
        src.playbackRate.setValueAtTime(src.playbackRate.value,t);
        src.playbackRate.linearRampToValueAtTime(v,t+(tm==null?.3:tm));
        return h;
      },
      move:function(p){if(pan)setPos(pan,p);return h;},
      stop:function(tm){
        h.vol(0,tm==null?.4:tm);
        setTimeout(()=>{try{src.stop();}catch(e){}},((tm==null?.4:tm)+.15)*1000);
      }
    };
    return h;
  };
})();

/* 画面に合わせる。縦持ちは横の視野が狭くなりすぎるので、縦FOVを広げて補う
   （縦FOV70°・アスペクト0.46 だと横は約35°しかなく、道が見えない） */
function fitCamera(){
  const a=innerWidth/innerHeight;
  let fov=70;
  if(a<1.25){
    const hMin=72*Math.PI/180;                       // 確保したい横FOV
    fov=Math.min(86,2*Math.atan(Math.tan(hMin/2)/a)*180/Math.PI);
  }
  camera.fov=Math.max(70,fov);
  camera.aspect=a;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener("resize",fitCamera);
// 回転直後は innerHeight がまだ古いことがあるので、少し待ってもう一度
addEventListener("orientationchange",()=>setTimeout(fitCamera,320));

/* ---------- ジオメトリ生成（UVを実寸でタイリング） ---------- */
const _boxCache={};
function uvBox(geo,w,h,d,tile){
  const uv=geo.attributes.uv;
  const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++){
    const su=dims[f][0]/tile,sv=dims[f][1]/tile;
    for(let i=0;i<4;i++){
      const k=f*4+i;
      uv.setXY(k,uv.getX(k)*su,uv.getY(k)*sv);
    }
  }
  uv.needsUpdate=true;
  return geo;
}
/**
 * box({w,h,d,x,y,z,ry,mat,to,tile,solid,cast,recv,name})
 *  y は「底面」の高さ。solid:true で当たり判定を追加。
 */
function box(o){
  const w=o.w,h=o.h,d=o.d,tile=o.tile||2;
  const key=w.toFixed(3)+"_"+h.toFixed(3)+"_"+d.toFixed(3)+"_"+tile;
  let geo=_boxCache[key];
  if(!geo){geo=uvBox(new THREE.BoxGeometry(w,h,d),w,h,d,tile);_boxCache[key]=geo;}
  const m=new THREE.Mesh(geo,o.mat||MAT.dark);
  m.position.set(o.x||0,(o.y||0)+h/2,o.z||0);
  if(o.ry)m.rotation.y=o.ry;
  m.castShadow=o.cast!==false;
  m.receiveShadow=o.recv!==false;
  (o.to||scene).add(m);
  if(o.solid)addSolid(o.x||0,o.z||0,w,d,o.ry||0,o.list);
  if(o.name)m.name=o.name;
  return m;
}
const _planeCache={};
function plane(o){
  const w=o.w,h=o.h,tile=o.tile||2;
  const key=w.toFixed(3)+"_"+h.toFixed(3)+"_"+tile;
  let geo=_planeCache[key];
  if(!geo){

  const m=new THREE.Mesh(geo,o.mat||MAT.dark);
  m.position.set(o.x||0,o.y||0,o.z||0);

/* ---------- 有機的な形をつくる ---------- */
/* 球の各成分を sign(v)|v|^e で押し広げると、角の丸い箱になる。
   e=0.4 でほぼ箱、e=0.8 でかなり丸い。布団・枕・人体に使う。 */
const _rbCache={};
function roundedBoxGeo(w,h,d,e,seg){
  const key=[w,h,d,e,seg].join("_");
  if(_rbCache[key])return _rbCache[key];
  const g=new THREE.SphereGeometry(1,seg||16,Math.max(8,Math.round((seg||16)*.6)));
  const p=g.attributes.position;
  const f=v=>(v<0?-1:1)*Math.pow(Math.abs(v),e==null?.5:e);
  for(let i=0;i<p.count;i++){
    p.setXYZ(i,f(p.getX(i))*w/2,f(p.getY(i))*h/2,f(p.getZ(i))*d/2);
  }
  g.computeVertexNormals();
  _rbCache[key]=g;
  return g;
}
function roundedBox(o){
  const m=new THREE.Mesh(roundedBoxGeo(o.w,o.h,o.d,o.e,o.seg),o.mat||MAT.dark);
  m.position.set(o.x||0,(o.y||0)+(o.center?0:o.h/2),o.z||0);
  if(o.rx)m.rotation.x=o.rx;
  if(o.ry)m.rotation.y=o.ry;
  if(o.rz)m.rotation.z=o.rz;
  m.castShadow=o.cast!==false;m.receiveShadow=o.recv!==false;
  (o.to||scene).add(m);
  return m;
}
/* くしゃっとしたゴミ袋。球を潰して底を平らにし、上を絞って結び目を作り、
   面ごとにランダムな凹凸を付けてフラットシェーディングでしわに見せる。 */
function bagGeo(rnd){
  const g=new THREE.SphereGeometry(.42,11,9);
  const p=g.attributes.position;
  const h=(a,b,c)=>{const s=Math.sin(a*12.9898+b*78.233+c*37.719)*43758.5453;return s-Math.floor(s);};
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const t=(y+.42)/.84;                       // 0=底 1=頂
    // 底は潰れて広がり、上はすぼまる
    const rad=.72+.62*Math.sin(Math.PI*Math.min(1,t*1.12))-(t>.72?(t-.72)*1.9:0);
    x*=Math.max(.12,rad); z*=Math.max(.12,rad);
    y=y*.86+.05;
    if(y<-.30)y=-.30-(y+.30)*.25;              // 接地面を平らに
    // しわ
    const n=h(x+rnd,y*1.7,z-rnd)-.5;
    const len=Math.hypot(x,y,z)||1;
    x+=x/len*n*.085; y+=y/len*n*.055; z+=z/len*n*.085;
    p.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals();
  return g;
}

/* ---------- 当たり判定（XZ平面のAABB） ---------- */
const SOLID={out:[],in:[]};
let solidTarget=SOLID.out;
function addSolid(cx,cz,w,d,ry,list){
  // 回転した箱は外接AABBで近似（45度以下の回転が主なので実用上問題なし）
  let hw=w/2,hd=d/2;
  if(ry){
    const c=Math.abs(Math.cos(ry)),s=Math.abs(Math.sin(ry));
    const nw=hw*c+hd*s,nd=hw*s+hd*c;hw=nw;hd=nd;
  }
  (list||solidTarget).push({x0:cx-hw,x1:cx+hw,z0:cz-hd,z1:cz+hd});
}
function addSolidRect(x0,z0,x1,z1,list){
  (list||solidTarget).push({x0:Math.min(x0,x1),x1:Math.max(x0,x1),
                            z0:Math.min(z0,z1),z1:Math.max(z0,z1)});
}

/* ---------- ライトプール ----------
   街灯や自販機は「光源スペック」として登録しておき、
   毎フレーム、プレイヤーに近い順に実ライトへ割り当てる。
   ライト個数が変わらないのでシェーダ再コンパイルが起きない。          */
const LIGHTSPEC={spot:[],point:[]};
const POOL={spot:[],point:[]};
function addSpotSpec(x,y,z,o){
  o=o||{};
  const s={x:x,y:y,z:z,color:o.color==null?0xffdca8:o.color,
    inten:o.inten==null?3.2:o.inten,dist:o.dist||24,ang:o.ang||.72,
    pen:o.pen==null?.55:o.pen,on:true,ref:null};
  LIGHTSPEC.spot.push(s);return s;
}
function addPointSpec(x,y,z,o){
  o=o||{};
  const s={x:x,y:y,z:z,color:o.color==null?0xcfe8ff:o.color,
    inten:o.inten==null?2.2:o.inten,dist:o.dist||14,on:true,ref:null};
  LIGHTSPEC.point.push(s);return s;
}
function buildPool(){
  for(let i=0;i<3;i++){
    const L=new THREE.SpotLight(0xffdca8,0,24,.72,.55,1.6);
    L.castShadow=i<(MOBILE?1:2);
    if(L.castShadow){
      L.shadow.mapSize.set(MOBILE?512:1024,MOBILE?512:1024);
      L.shadow.camera.near=.6;L.shadow.camera.far=26;
      L.shadow.bias=-.0016;L.shadow.normalBias=.03;
    }
    L.target.position.set(0,0,0);
    scOut.add(L);scOut.add(L.target);
    POOL.spot.push(L);
  }
  for(let i=0;i<3;i++){
    const L=new THREE.PointLight(0xcfe8ff,0,14,1.7);
    scOut.add(L);POOL.point.push(L);
  }
}
const _tmpSort=[];
function updatePool(px,pz){
  ["spot","point"].forEach(kind=>{
    const specs=LIGHTSPEC[kind],pool=POOL[kind];
    _tmpSort.length=0;
    for(let i=0;i<specs.length;i++){
      const s=specs[i];
      if(!s.on||s.inten<=0)continue;
      const dx=s.x-px,dz=s.z-pz;
      s._d=dx*dx+dz*dz;
      if(s._d<40000)_tmpSort.push(s);
    }
    _tmpSort.sort((a,b)=>a._d-b._d);
    for(let i=0;i<pool.length;i++){
      const L=pool[i],s=_tmpSort[i];
      if(!s){L.intensity=0;continue;}
      L.position.set(s.x,s.y,s.z);
      L.color.setHex(s.color);
      L.intensity=s.inten;
      L.distance=s.dist;
      if(kind==="spot"){
        L.angle=s.ang;L.penumbra=s.pen;
        L.target.position.set(s.x,0,s.z);
        L.target.updateMatrixWorld();
      }
    }
  });
}

const LOC={

function buildWorld(){

  // 白い外側線
  const lineM=plain(0xb9b6ac,{rough:.7});
  function line(x,z,w,d){plane({w:w,h:d,x:x,y:.032,z:z,mat:lineM,tile:99,to:S});}

  line(2.35,-56.83,.11,140.05);                                    // 縦の道・東（角まで）

  // 内側の曲線（半径1.15mで四半円）
  (function(){

    for(let i=0;i<N;i++){

      const x1=ccx+Math.cos(t1)*r,z1=ccz+Math.sin(t1)*r;

  function wallRun(side,z0,z1,gaps){

  // z軸は南(+)→北(-)。範囲は [北端, 南端] の順で扱う
  wallRun(+1,-127,14,[[-13.6,-8.4],[-3.5,7.5]]);

  function house(cx,cz,w,d,story,ry){

  box({w:7,h:1.6,d:.2,x:0,y:0,z:13.6,mat:MAT.block,tile:1.2,to:S});

  /* ---------------- 電柱と電線 ---------------- */
  const poles=[];
  function pole(x,z){

  // 電線

  function wire(a,b,sag,dy){

      const p=(t)=>{

  }
  for(let i=0;i<5;i++)for(let k=0;k<4;k++)
    wire(poles[i],poles[i+1],.55,-1.1-k*.42);
  wire(poles[5],polesB[0],.5,-1.1);
  wire(poles[5],polesB[0],.5,-1.6);
  for(let i=0;i<polesB.length-1;i++)for(let k=0;k<3;k++)
    wire(polesB[i],polesB[i+1],.5,-1.1-k*.45);
  const wg=new THREE.BufferGeometry();
  wg.setAttribute("position",new THREE.BufferAttribute(new Float32Array(wpts),3));
  S.add(new THREE.LineSegments(wg,new THREE.LineBasicMaterial({color:0x14161c,fog:true})));

  /* ---------------- 街灯 ---------------- */
  function streetLamp(x,z,dir){
    const h=4.6;
    cyl({rt:.075,h:h,x:x,y:0,z:z,mat:plain(0x4a4a46,{rough:.9}),seg:8,to:S});
    box({w:1.15,h:.08,d:.08,x:x+.55*dir,y:h-.1,z:z,mat:plain(0x4a4a46),tile:1,to:S});
    const hx=x+1.05*dir;
    box({w:.52,h:.14,d:.3,x:hx,y:h-.28,z:z,mat:MAT.metalD,tile:1,to:S});
    const bulb=new THREE.Mesh(new THREE.PlaneGeometry(.46,.26),MAT.lampOn);
    bulb.rotation.x=Math.PI/2;bulb.position.set(hx,h-.3,z);S.add(bulb);
    glow({x:hx,y:h-.34,z:z,s:3.4,color:0xffd9a2,op:.5,to:S});
    addSolid(x,z,.32,.32,0,SOLID.out);
    return addSpotSpec(hx,h-.32,z,{color:0xffd7a0,inten:4.0,dist:27,ang:.95,pen:.62});
  }
  // dir は「アームを伸ばす向き」。灯りが道路の上に来るように、
  // 西側(x=-3)の灯は +1、東側(x=+3)の灯は -1。
  G.lamps=[];
  G.lamps.push(streetLamp(-3.0,6,1));
  G.lamps.push(streetLamp(3.0,-6,-1));    // アパート手前（液体の筋が見えるように）
  G.lamps.push(streetLamp(3.0,-20,-1));
  G.lamps.push(streetLamp(3.0,-44,-1));   // 自販機の真向かい（最後のカットの逆光になる）
  G.lamps.push(streetLamp(-3.0,-68,1));
  G.lamps.push(streetLamp(3.0,-92,-1));
  G.lamps.push(streetLamp(-3.0,-116,1));
  G.lamps.push(streetLamp(-12,-127.9,0));
  G.lamps.push(streetLamp(-28,-127.9,0));


  buildTrash();
  buildVending();
  buildPark();
  buildStore();
  buildApartmentExterior();
  scatterProps();
}

/* ============================ ゴミ捨て場 ============================ */
function buildTrash(){
  const S=scOut,p=LOC.trash;
  const g=new THREE.Group();g.position.copy(p);S.add(g);
  // コンクリの土間
  plane({w:3.4,h:3.0,x:0,y:.03,z:0,mat:MAT.gutter,tile:1.6,to:g});
  // 三方の低い囲い＋支柱
  box({w:.12,h:1.0,d:3.0,x:1.6,y:0,z:0,mat:MAT.block,tile:1,to:g});
  box({w:3.4,h:1.0,d:.12,x:0,y:0,z:1.5,mat:MAT.block,tile:1,to:g});
  box({w:3.4,h:1.0,d:.12,x:0,y:0,z:-1.5,mat:MAT.block,tile:1,to:g});
  addSolidRect(p.x-1.4,p.z-1.7,p.x+1.9,p.z+1.7,SOLID.out);
  [[-1.6,-1.4],[-1.6,1.4],[1.6,-1.4],[1.6,1.4]].forEach(c=>
    cyl({rt:.045,h:2.0,x:c[0],y:0,z:c[1],mat:MAT.metalD,seg:6,to:g}));
  // カラス除けネット
  const net=new THREE.Mesh(new THREE.BoxGeometry(3.3,1.5,2.9),
    new THREE.MeshStandardMaterial({color:0x2d4a3a,roughness:1,transparent:true,opacity:.34,
      side:THREE.DoubleSide,depthWrite:false}));
  net.position.set(0,.9,0);g.add(net);
  // 看板
  const sg=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.55),
    unlit(0xffffff,{map:TEX.sign("ゴミ出しは\n朝8時までに",{size:40,bg:"#eeeadf",fg:"#3a3d42",border:"#3a3d42",bw:6,w:512,h:256})}));
  sg.position.set(1.62,1.5,0);sg.rotation.y=-Math.PI/2;g.add(sg);

  /* ゴミ袋。球ではなく、潰れて口を絞った袋の形。しわはフラットシェーディングで出す */
  const bags=[];
  const bagMats=[
    new THREE.MeshStandardMaterial({color:0x9aa0a2,roughness:.62,metalness:.02,
      flatShading:true,transparent:true,opacity:.96}),
    new THREE.MeshStandardMaterial({color:0x8e968f,roughness:.66,metalness:.02,flatShading:true}),
    new THREE.MeshStandardMaterial({color:0x54707e,roughness:.66,metalness:.02,flatShading:true})
  ];
  for(let i=0;i<10;i++){
    const bg=new THREE.Group();
    bg.position.set(rr(-1.15,1.15),0,rr(-1.0,1.0));
    bg.rotation.y=rr(0,6.28);
    bg.rotation.z=rr(-.16,.16);
    g.add(bg);
    const mat=bagMats[RND()<.62?0:(RND()<.5?1:2)];
    const s=rr(.82,1.18);
    const body=new THREE.Mesh(bagGeo(rr(0,99)),mat);
    body.scale.set(s*rr(.92,1.1),s*rr(.78,1.0),s*rr(.92,1.1));
    body.position.y=.30*s;
    body.castShadow=true;body.receiveShadow=true;bg.add(body);
    // 口を縛った結び目
    const kn=new THREE.Mesh(roundedBoxGeo(.10,.09,.10,.7,10),mat);
    kn.position.y=.30*s+.30*s;kn.rotation.y=rr(0,3);bg.add(kn);
    const ear=new THREE.Mesh(roundedBoxGeo(.19,.035,.07,.6,8),mat);
    ear.position.y=.30*s+.34*s;ear.rotation.set(rr(-.4,.4),rr(0,3),rr(-.5,.5));bg.add(ear);
    bags.push(bg);
  }
  // 帰り道でだけ現れる「液体」（最初は非表示）
  const pool=new THREE.Mesh(new THREE.CircleGeometry(1,26),MAT.goo);
  pool.rotation.x=-Math.PI/2;pool.position.set(-.3,.045,.2);
  pool.scale.set(.01,.01,.01);pool.visible=false;g.add(pool);
  /* 自宅へ続く筋。
     塀の裏を通ると見えないので、切れ目から道路側へ出して側溝を伝わせ、
     最後に玄関へ折れる。短冊を伸ばすと「棒が伸びる」ように見えるので、
     少し蛇行する帯を1枚のメッシュで作り、描画範囲を伸ばして流れを出す。 */
  const tpts=[[3.66,p.z+.22],[3.34,p.z+.26],[3.06,p.z+.38],[2.88,p.z+.54]];
  for(let z=p.z+.85;z<=1.65;z+=.26)
    tpts.push([2.72+Math.sin(z*.85)*.048+Math.sin(z*2.4)*.022,z]);
  tpts.push([2.79,1.90],[2.98,2.06],[3.28,2.16],[3.62,2.20],[3.92,2.21]);
  const TN=tpts.length;
  const tpos=new Float32Array(TN*6),tidx=[];
  for(let i=0;i<TN;i++){
    const a=tpts[Math.max(0,i-1)],b=tpts[Math.min(TN-1,i+1)];
    let dx=b[0]-a[0],dz=b[1]-a[1];
    const L=Math.hypot(dx,dz)||1;dx/=L;dz/=L;
    const wdt=(i<4?.30:lerp(.25,.165,Math.min(1,(i-4)/16)))*(1+.13*Math.sin(i*1.63));
    tpos[i*6  ]=tpts[i][0]-dz*wdt/2; tpos[i*6+1]=.042; tpos[i*6+2]=tpts[i][1]+dx*wdt/2;
    tpos[i*6+3]=tpts[i][0]+dz*wdt/2; tpos[i*6+4]=.042; tpos[i*6+5]=tpts[i][1]-dx*wdt/2;
    if(i<TN-1)tidx.push(i*2,i*2+2,i*2+1, i*2+1,i*2+2,i*2+3);
  }
  const tgeo=new THREE.BufferGeometry();
  tgeo.setAttribute("position",new THREE.BufferAttribute(tpos,3));
  tgeo.setIndex(tidx);tgeo.computeVertexNormals();
  tgeo.setDrawRange(0,0);
  const tmesh=new THREE.Mesh(tgeo,
    new THREE.MeshStandardMaterial({color:MAT.goo.color,roughness:MAT.goo.roughness,
      metalness:MAT.goo.metalness,side:THREE.DoubleSide}));
  tmesh.visible=false;S.add(tmesh);
  // 先端のふくらみ（流れの頭）
  const thead=new THREE.Mesh(new THREE.CircleGeometry(.13,16),tmesh.material);
  thead.rotation.x=-Math.PI/2;thead.visible=false;S.add(thead);
  const trail={mesh:tmesh,head:thead,pts:tpts,N:TN,t:0};

  G.trash={group:g,bags:bags,pool:pool,trail:trail,drips:[]};
}

/* ============================ 自動販売機 ============================ */
function buildVending(){
  const S=scOut,p=LOC.vend;
  const g=new THREE.Group();g.position.copy(p);S.add(g);
  plane({w:4.6,h:2.6,x:.5,y:.035,z:0,mat:MAT.gutter,tile:1.6,to:g});
  // 背後の閉まった店
  box({w:.3,h:3.4,d:7,x:-1.5,y:0,z:0,mat:MAT.tin,tile:1.6,solid:false,to:g});
  addSolidRect(p.x-2.2,p.z-4.6,p.x-1.2,p.z+4.6,SOLID.out);
  /* 酒・たばこの袖看板（箱型・枠付き・腕木で壁から出す） */
  (function(){
    const sg=new THREE.Group();sg.position.set(-1.30,0,2.2);g.add(sg);
    const fr=plain(0x2a2f36,{rough:.6,metal:.4});
    // 腕木
    box({w:.30,h:.06,d:.06,x:-.02,y:3.72,z:0,mat:fr,tile:1,to:sg});
    box({w:.30,h:.06,d:.06,x:-.02,y:1.30,z:0,mat:fr,tile:1,to:sg});
    // 看板の箱
    box({w:.13,h:2.55,d:.62,x:.20,y:1.25,z:0,mat:fr,tile:1,to:sg});
    // 表示面（両面）
    const face=TEX.vsign("酒・たばこ",{size:76,bg:"#f2ede0",fg:"#20242a",w:160,h:640});
    [[.275,Math.PI/2],[.125,-Math.PI/2]].forEach(a=>{
      const pl=new THREE.Mesh(new THREE.PlaneGeometry(.54,2.42),unlit(0xffffff,{map:face}));
      pl.position.set(a[0],2.52,0);pl.rotation.y=a[1];sg.add(pl);
    });
  })();

  /* 自動販売機。前面は「枠に落とし込んだ見本窓＋選択ボタン列＋硬貨と紙幣の投入口
     ＋返却レバー＋取り出し口」まで作る。X+ が正面。 */
  function machine(zoff,lit){
    const m=new THREE.Group();m.position.set(0,0,zoff);g.add(m);
    const bodyM=plain(0x2a2e34,{rough:.52,metal:.55});   // 側面・背面
    const frontM=plain(0x6f7981,{rough:.45,metal:.5});   // 前面パネル
    const drkM =plain(0x0c0e11,{rough:.9});              // 開口の闇
    const chrM =plain(0x9a958a,{rough:.32,metal:.9});    // 金物
    const W=.78,H=1.83,D=1.12;                            // 奥行 / 高さ / 幅
    box({w:W,h:H,d:D,x:0,y:0,z:0,mat:bodyM,tile:1.4,to:m});
    addSolid(p.x,p.z+zoff,.9,1.22,0,SOLID.out);
    // 前面パネル（本体よりわずかに出す）
    box({w:.05,h:H-.02,d:D,x:W/2,y:.01,z:0,mat:frontM,tile:1.2,to:m});

    // ── 商品見本の窓（枠に落とし込む） ──
    const wy0=.70,wy1=1.62,wz=.50;
    const face=new THREE.Mesh(new THREE.PlaneGeometry(wz*2,wy1-wy0),
      unlit(0xffffff,{map:TEX.vendFront(!lit)}));
    face.position.set(W/2+.026,(wy0+wy1)/2,0);face.rotation.y=Math.PI/2;m.add(face);
    // 窓枠
    box({w:.045,h:.055,d:wz*2+.10,x:W/2+.030,y:wy1,z:0,mat:frontM,tile:1,to:m});
    box({w:.045,h:.055,d:wz*2+.10,x:W/2+.030,y:wy0-.055,z:0,mat:frontM,tile:1,to:m});
    box({w:.045,h:wy1-wy0+.11,d:.05,x:W/2+.030,y:wy0-.055,z:-wz-.025,mat:frontM,tile:1,to:m});
    box({w:.045,h:wy1-wy0+.11,d:.05,x:W/2+.030,y:wy0-.055,z: wz+.025,mat:frontM,tile:1,to:m});
    // ガラスの映り込み
    const gls=new THREE.Mesh(new THREE.PlaneGeometry(wz*2,wy1-wy0),
      new THREE.MeshStandardMaterial({color:0xaecbe0,transparent:true,opacity:.07,
        roughness:.34,metalness:.24,depthWrite:false}));
    gls.position.set(W/2+.032,(wy0+wy1)/2,0);gls.rotation.y=Math.PI/2;m.add(gls);

    // ── 選択ボタン列（見本の真下） ──
    box({w:.05,h:.14,d:wz*2,x:W/2+.028,y:wy0-.20,z:0,mat:plain(0x1d2126,{rough:.7}),tile:1,to:m});
    for(let i=0;i<5;i++){
      const bz=-.40+i*.20;
      box({w:.035,h:.055,d:.13,x:W/2+.052,y:wy0-.165,z:bz,
        mat:lit?plain(0xc0392b,{rough:.5,em:0x2a0a06,ei:1}):plain(0x33231f,{rough:.8}),tile:1,to:m});
      // 値段の札
      box({w:.03,h:.035,d:.15,x:W/2+.050,y:wy0-.095,z:bz,
        mat:plain(lit?0xbfb9a8:0x2b2b28,{rough:.85}),tile:1,to:m});
    }

    // ── 硬貨・紙幣・返却 ──
    box({w:.05,h:.30,d:.22,x:W/2+.028,y:.86,z:.36,mat:plain(0x20242a,{rough:.7}),tile:1,to:m}); // 投入部の台座
    box({w:.03,h:.012,d:.115,x:W/2+.052,y:1.10,z:.36,mat:drkM,tile:1,to:m});                   // 紙幣挿入口
    cyl({rt:.017,h:.03,x:W/2+.052,y:1.02,z:.36,mat:drkM,seg:8,rz:Math.PI/2,center:true,to:m});  // 硬貨投入口
    box({w:.035,h:.05,d:.05,x:W/2+.055,y:.93,z:.36,mat:chrM,tile:1,to:m});                      // 返却レバー
    box({w:.04,h:.09,d:.16,x:W/2+.040,y:.74,z:.36,mat:drkM,tile:1,to:m});                       // 釣銭口
    // 金額表示
    box({w:.03,h:.05,d:.16,x:W/2+.052,y:1.20,z:.36,
      mat:lit?plain(0x101a12,{em:0x1e5a2a,ei:1.4,rough:.4}):plain(0x101210,{rough:.8}),tile:1,to:m});

    // ── 取り出し口（フラップ付き） ──
    box({w:.10,h:.34,d:.64,x:W/2-.02,y:.16,z:-.06,mat:drkM,tile:1,to:m});
    const flap=box({w:.028,h:.28,d:.60,x:W/2+.030,y:.24,z:-.06,
      mat:plain(0x23282d,{rough:.55,metal:.45}),tile:1,to:m});
    flap.rotation.x=-.13;
    box({w:.035,h:.028,d:.62,x:W/2+.040,y:.50,z:-.06,mat:chrM,tile:1,to:m});   // 上の縁

    // ── 上部の看板 ──
    box({w:.05,h:.19,d:D,x:W/2+.002,y:H-.20,z:0,mat:frontM,tile:1,to:m});
    const top=new THREE.Mesh(new THREE.PlaneGeometry(D-.10,.17),
      unlit(lit?0xffffff:0x1a1d22,{map:TEX.sign("いつでも つめたい",
        {size:52,bg:lit?"#c8202a":"#1a1d22",fg:lit?"#ffffff":"#33363c"})}));
    top.position.set(W/2+.030,H-.115,0);top.rotation.y=Math.PI/2;m.add(top);
    // 脚（床から少し浮かせる）
    [-.42,.42].forEach(bz=>box({w:.5,h:.05,d:.10,x:0,y:-.05,z:bz,mat:drkM,tile:1,to:m}));

    const gl=glow({x:1.0,y:1.15,z:zoff,s:lit?5.2:0,color:0xd8ecff,op:lit?.42:0,to:g});
    return {group:m,face:face,top:top,glow:gl};
  }
  const A=machine(1.0,true);    // 光っている方（怪異はこちら）
  const B=machine(-1.0,false);  // 切れている方
  const spec=addPointSpec(p.x+1.1,1.3,p.z+1.0,{color:0xcfe6ff,inten:3.6,dist:13});
  G.vend={group:g,A:A,B:B,spec:spec,lit:true,knockPos:new THREE.Vector3(p.x+.5,1.1,p.z+1.0)};
}

/* ============================ 公園 ============================ */
function buildPark(){
  const S=scOut,p=LOC.park;
  const g=new THREE.Group();g.position.copy(p);S.add(g);
  plane({w:22,h:24,x:-6,y:.03,z:0,mat:MAT.gravel,tile:5,to:g});
  // フェンス
  const fm=plain(0x35383c,{rough:.9,metal:.3});
  function fence(x,z,len,ry){
    box({w:len,h:.08,d:.05,x:x,y:1.15,z:z,mat:fm,tile:1,ry:ry,to:g});
    box({w:len,h:.08,d:.05,x:x,y:.5,z:z,mat:fm,tile:1,ry:ry,to:g});
    const n=Math.floor(len/1.6);
    for(let i=0;i<=n;i++){
      const t=(i/n-.5)*len;
      cyl({rt:.035,h:1.25,x:x+(ry?0:t),y:0,z:z+(ry?t:0),mat:fm,seg:6,to:g});

  fence(-6,-11.5,22,0);  fence(-6,11.5,22,0);

  addSolidRect(p.x-18,p.z+11,p.x+5.2,p.z+12,SOLID.out);

  addSolidRect(p.x+4.8,p.z-12,p.x+5.2,p.z-1.5,SOLID.out);   // 入口(z:-1.5〜+3)を残す
  addSolidRect(p.x+4.8,p.z+3,p.x+5.2,p.z+12,SOLID.out);

  // 公園灯（ブランコが「見える」程度にだけ照らす）

  pl.position.set(1.5,3.62,-3);g.add(pl);
  glow({x:1.5,y:3.62,z:-3,s:3.0,color:0xf3d9ab,op:.42,to:g});
  addSolid(p.x+1.5,p.z-3,.3,.3,0,SOLID.out);
  addPointSpec(p.x+1.5,3.6,p.z-3,{color:0xf3d9ab,inten:1.7,dist:11.5});

  // 木（夜なので、ほとんど黒い塊）

    if(Math.abs(tx+3.5)<3.4&&Math.abs(tz-1)<4)continue;
    cyl({rt:.16,rb:.22,h:rr(2.2,3.2),x:tx,y:0,z:tz,mat:MAT.trunk,seg:6,to:g});
    const c=new THREE.Mesh(new THREE.SphereGeometry(rr(1.5,2.3),7,5),MAT.leaf);
    c.position.set(tx,rr(3.6,4.6),tz);c.scale.set(1.1,.78,1.0);c.castShadow=true;g.add(c);
    addSolid(p.x+tx,p.z+tz,.5,.5,0,SOLID.out);
  }
  // ベンチ
  box({w:1.6,h:.08,d:.42,x:-2,y:.42,z:7.5,mat:MAT.wood,tile:.6,to:g});
  box({w:.1,h:.42,d:.4,x:-2.7,y:0,z:7.5,mat:MAT.metalD,tile:1,to:g});
  box({w:.1,h:.42,d:.4,x:-1.3,y:0,z:7.5,mat:MAT.metalD,tile:1,to:g});
  // 砂場
  plane({w:4,h:4,x:-9,y:.05,z:6,mat:MAT.dirt,tile:2,to:g});
  box({w:4.2,h:.22,d:.2,x:-9,y:0,z:4,mat:MAT.wood,tile:1,to:g});
  box({w:4.2,h:.22,d:.2,x:-9,y:0,z:8,mat:MAT.wood,tile:1,to:g});
  // 滑り台
  (function(){
    const s=new THREE.Group();s.position.set(-4.5,0,-6);s.rotation.y=.5;g.add(s);
    box({w:.7,h:1.8,d:.7,x:0,y:0,z:0,mat:MAT.metalD,tile:1,to:s});
    const sl=box({w:.72,h:.07,d:3.0,x:0,y:1.0,z:1.6,mat:MAT.metal,tile:1,to:s});
    sl.rotation.x=.52;
    addSolid(LOC.park.x-4.5,LOC.park.z-6,1.4,3.4,.5,SOLID.out);
  })();

  /* --- ブランコ --- */
  const sw=new THREE.Group();
  sw.position.set(-3.5,0,1);g.add(sw);
  const fmm=plain(0x5a5750,{rough:.62,metal:.45});
  /* A字フレーム：脚の下端を地面(y=0)、上端を横棒(y=2.78,z=0)で合わせる。
     脚の長さ L と傾き th は  (L/2)cos(th)=1.39, (L/2)sin(th)=0.75  から決める。 */
  const LEG=3.16, TH=.495, LEGY=1.39;
  [[-1.5],[1.5]].forEach(a=>{
    const x=a[0];
    const l1=cyl({rt:.055,h:LEG,x:x,y:LEGY,z:-.75,mat:fmm,seg:6,center:true,to:sw});
    l1.rotation.x=TH;                      // 上が内側（z=0）へ寄る
    const l2=cyl({rt:.055,h:LEG,x:x,y:LEGY,z:.75,mat:fmm,seg:6,center:true,to:sw});
    l2.rotation.x=-TH;
    addSolid(LOC.park.x-3.5+x,LOC.park.z+1,.34,3.2,0,SOLID.out);
  });
  const bar=cyl({rt:.05,h:3.4,x:0,y:2.78,z:0,mat:fmm,seg:8,rz:Math.PI/2,center:true,to:sw});
  const seats=[];
  [-.72,.72].forEach(sx=>{
    const piv=new THREE.Group();
    piv.position.set(sx,2.76,0);sw.add(piv);
    [-.2,.2].forEach(cx=>{
      cyl({rt:.014,h:2.32,x:cx,y:-1.16,z:0,mat:plain(0x2e3136,{metal:.8,rough:.5}),
        seg:5,center:true,to:piv});
    });
    const seat=box({w:.46,h:.05,d:.22,x:0,y:-2.35,z:0,mat:plain(0x3a3d43,{rough:.8}),tile:1,to:piv});
    seats.push({pivot:piv,seat:seat});
  });
  G.park={group:g,swing:sw,seats:seats,
    swingPos:new THREE.Vector3(LOC.park.x-3.5,1.2,LOC.park.z+1)};
}

    box({w:.56,h:.13,d:len,x:ox-.02,y:0,z:oz,mat:plain(0x8f8b82,{rough:.7}),tile:1,to:g}); // 台輪
    box({w:.03,h:.04,d:len,x:ox+.30,y:.52,z:oz,mat:frameM,tile:1,to:g});                   // 見切り
    box({w:.66,h:.05,d:len,x:ox,y:.85,z:oz,mat:frameM,tile:1,to:g});                       // 天板
    box({w:.10,h:1.62,d:len,x:ox-.28,y:.05,z:oz,mat:frameM,tile:1,to:g});                  // 背板

    oniSign.position.set(ox+.085,1.59,oz);oniSign.rotation.y=Math.PI/2;g.add(oniSign);
    box({w:.16,h:.05,d:len-.06,x:ox+.01,y:1.74,z:oz,mat:frameM,tile:1,to:g});   // 看板の笠

  /* レジカウンター */
  (function(){

    box({w:.52,h:.26,d:.44,x:rx+.9,y:1.03,z:rz,mat:plain(0x3a4046,{rough:.6}),tile:1,to:g});
    box({w:.30,h:.16,d:.26,x:rx+.9,y:1.29,z:rz+.06,mat:plain(0x2b3036,{rough:.7}),tile:1,to:g});
    box({w:.42,h:.03,d:.30,x:rx+.9,y:1.29,z:rz-.14,mat:plain(0x53595f,{rough:.5}),tile:1,to:g});

    box({w:.62,h:.10,d:.44,x:rx-1.0,y:.98,z:rz,mat:frameM,tile:1,to:g});
    const cs=new THREE.Mesh(new THREE.BoxGeometry(.58,.34,.40),
      new THREE.MeshStandardMaterial({color:0xdfe6ea,transparent:true,opacity:.20,
        roughness:.15,metalness:.3,depthWrite:false}));
    cs.position.set(rx-1.0,1.25,rz);g.add(cs);
    for(let k=0;k<6;k++)
      putProd(rx-1.2+(k%3)*.20,1.12,rz-.10+Math.floor(k/3)*.16,.13,.09,.13,0,0xe8e0cc);
    // 背後のタバコ棚
    box({w:3.0,h:1.3,d:.24,x:rx,y:1.35,z:rz+.62,mat:frameM,tile:1,to:g});
    for(let r=0;r<4;r++){

    addSolid(rx,rz,3.5,.9,0,SOLID.out);

    box({w:.72,h:.06,d:.62,x:sx,y:.93,z:sz,mat:plain(0x8d949b,{rough:.4,metal:.4}),tile:1,to:g});

       立った客が見下ろす角度になるよう、上端を奥へ20度ほど。 */
    (function(){
      const sg=new THREE.Group();
      sg.position.set(sx+.02,1.28,sz-.06);
      sg.rotation.x=.34;                      // 上端が奥、画面はやや上を向く
      g.add(sg);
      const hs=new THREE.Mesh(new THREE.BoxGeometry(.50,.38,.055),

      const scr=new THREE.Mesh(new THREE.PlaneGeometry(.43,.32),

      scr.position.set(0,0,-.030);scr.rotation.y=Math.PI;sg.add(scr);
    })();
    // スキャナ面
    box({w:.26,h:.02,d:.20,x:sx-.18,y:.98,z:sz-.10,mat:plain(0x1a1f24,{rough:.2,metal:.5}),tile:1,to:g});
    // 硬貨・紙幣ユニット
    box({w:.20,h:.30,d:.16,x:sx-.20,y:1.00,z:sz+.14,mat:plain(0x2b3036,{rough:.6}),tile:1,to:g});
    box({w:.12,h:.012,d:.05,x:sx-.20,y:1.24,z:sz+.06,mat:plain(0x0d0f12,{rough:.9}),tile:1,to:g});
    // レシート口
    box({w:.11,h:.014,d:.04,x:sx+.20,y:1.02,z:sz-.16,mat:plain(0x0d0f12,{rough:.9}),tile:1,to:g});
    // 袋詰め台とフック
    box({w:.40,h:.04,d:.34,x:sx-.52,y:.90,z:sz,mat:plain(0x8d949b,{rough:.45,metal:.4}),tile:1,to:g});
    cyl({rt:.012,h:.26,x:sx-.66,y:.94,z:sz-.10,mat:plain(0x8d949b,{metal:.6,rough:.4}),seg:6,to:g});
    cyl({rt:.012,h:.26,x:sx-.66,y:.94,z:sz+.10,mat:plain(0x8d949b,{metal:.6,rough:.4}),seg:6,to:g});

    [[0x2e7d32,1.78],[0xd9a520,1.86],[0xc0392b,1.94]].forEach(a=>{

      b.position.set(sx+.30,a[1],sz+.16);g.add(b);
    });
    addSolid(sx,sz,.8,.7,0,SOLID.out);
    addSolid(sx-.52,sz,.5,.4,0,SOLID.out);
  })();

  // 並べた商品をまとめて1つのインスタンスメッシュに
  (function(){
    const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),
      plain(0xffffff,{rough:.55}),prodSpecs.length);
    const mtx=new THREE.Matrix4(),q=new THREE.Quaternion(),
          v=new THREE.Vector3(),s=new THREE.Vector3(),col=new THREE.Color();
    const up=new THREE.Vector3(0,1,0);
    prodSpecs.forEach((sp,i)=>{
      v.set(sp[0],sp[1],sp[2]);s.set(sp[3],sp[4],sp[5]);
      q.setFromAxisAngle(up,sp[6]||0);
      mtx.compose(v,q,s);
      im.setMatrixAt(i,mtx);
      im.setColorAt(i,col.setHex(sp[7]));
    });
    im.instanceMatrix.needsUpdate=true;
    if(im.instanceColor)im.instanceColor.needsUpdate=true;
    g.add(im);
    G.storeProducts=im;
  })();
  // 入口枠
  box({w:.18,h:3.2,d:.3,x:cx-2.2,y:.05,z:cz-5.5,mat:MAT.metalD,tile:1,to:g});
  box({w:.18,h:3.2,d:.3,x:cx+2.2,y:.05,z:cz-5.5,mat:MAT.metalD,tile:1,to:g});

  G.store={group:g,cx:cx,cz:cz,
    lightSpecs:LIGHTSPEC.point.slice(-2),
    lit:true,
    door:new THREE.Vector3(cx,0,cz-5.5),
    onigiri:new THREE.Vector3(cx-6.0,1.05,cz-1.0),
    reg:new THREE.Vector3(cx+2.6,1.1,cz-3.4)};
}

/* ============================ アパート（外観） ============================ */
function buildApartmentExterior(){
  const S=scOut;
  const g=new THREE.Group();S.add(g);
  const bx=8.6,bz=2.0;
  // 本体2階建て
  box({w:9.0,h:5.9,d:9.0,x:bx,y:0,z:bz,mat:MAT.mortar,tile:2.4,solid:true,to:g});
  box({w:9.6,h:.3,d:9.6,x:bx,y:5.9,z:bz,mat:MAT.dark,tile:2,to:g});
  // 外廊下（西面）
  box({w:1.5,h:.2,d:9.0,x:3.9,y:2.85,z:bz,mat:MAT.gutter,tile:1.5,to:g});
  for(let i=0;i<6;i++)
    cyl({rt:.035,h:1.0,x:3.2,y:3.05,z:bz-4+i*1.6,mat:MAT.metalD,seg:5,to:g});
  box({w:.06,h:.06,d:9.0,x:3.20,y:4.00,z:bz,mat:MAT.metalD,tile:1,to:g});  // 手すり
  /* 外階段：建物の南端に置き、上りきると2階の外廊下(y=3.05, z=6.5)につながる。
     塀(x=3.2)より東に収める。 */
  (function(){
    const N=14,topY=3.05,topZ=6.50,run=.27,rise=topY/N;
    const botZ=topZ+(N-1)*run;
    const st=new THREE.Group();st.position.set(4.15,0,0);g.add(st);
    const stM=plain(0x3a3d42,{rough:.6,metal:.5});
    for(let i=0;i<N;i++){
      const z=botZ-i*run;
      box({w:1.30,h:.05,d:.30,x:0,y:rise*(i+1)-.05,z:z,mat:MAT.metalD,tile:1,to:st});
      box({w:1.26,h:rise-.05,d:.03,x:0,y:rise*i,z:z-.145,
        mat:plain(0x1a1c20,{rough:.95}),tile:1,to:st});   // 蹴込み
    }
    const L=Math.hypot((N-1)*run,topY-rise),ang=Math.atan2(topY-rise,(N-1)*run);
    const midY=(rise+topY)/2,midZ=(botZ+topZ)/2;
    [-.68,.68].forEach(dx=>{
      const beam=new THREE.Mesh(new THREE.BoxGeometry(.08,.26,L),stM);
      beam.position.set(dx,midY-.11,midZ);beam.rotation.x=ang;
      beam.castShadow=true;beam.receiveShadow=true;st.add(beam);
      const rail=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,L),stM);
      rail.position.set(dx,midY+.86,midZ);rail.rotation.x=ang;st.add(rail);
      for(let k=0;k<4;k++){
        const t=k/3;

function buildRoom(ox,oz,mirror){
  const S=scIn;

  const put=o=>{o.x=X(o.x||0);o.z=Z(o.z||0);o.ry=RY(o.ry);o.to=o.to||g;
                if(o.solid){o.list=list;} return box(o);};
  const pl=o=>{o.x=X(o.x||0);o.z=Z(o.z||0);if(o.ry!=null)o.ry=RY(o.ry);o.to=o.to||g;return plane(o);};
  const cy=o=>{o.x=X(o.x||0);o.z=Z(o.z||0);o.to=o.to||g;return cyl(o);};

  const H=2.42;                       // 天井高
  /* ---- 床 ---- */

  pl({w:5.4,h:2.2,x:0,y:.06,z:1.9,mat:MAT.wood,tile:1.1});          // 台所・廊下
  pl({w:2.0,h:.85,x:0,y:0,z:3.45,mat:MAT.gutter,tile:.8});          // 玄関土間
  /* ---- 天井 ---- */
  pl({w:6.2,h:6.8,x:0,y:H,z:.6,mat:plain(0xa39c90,{rough:.98}),tile:2,rx:Math.PI/2});
  /* ---- 壁 ---- */
  const wm=plain(0x9c958a,{rough:.97});
  put({w:.12,h:H,d:6.8,x:-2.76,y:0,z:.6,mat:wm,tile:2,solid:true});   // 西
  put({w:.12,h:H,d:6.8,x: 2.76,y:0,z:.6,mat:wm,tile:2,solid:true});   // 東
  put({w:5.7,h:H,d:.12,x:0,y:0,z:-2.66,mat:wm,tile:2,solid:true});    // 南（窓側）
  put({w:1.85,h:H,d:.12,x:-1.93,y:0,z:3.88,mat:wm,tile:2,solid:true});// 北（玄関脇）
  put({w:1.85,h:H,d:.12,x: 1.93,y:0,z:3.88,mat:wm,tile:2,solid:true});
  // 巾木
  put({w:5.6,h:.07,d:.04,x:0,y:0,z:-2.58,mat:MAT.dark,tile:1});

  /* ---- 窓（南） ---- */
  const win=new THREE.Mesh(new THREE.PlaneGeometry(2.5,1.25),
    plain(0x0c1220,{rough:.28,metal:.32}));
  win.position.set(X(0),1.35,Z(-2.59));g.add(win);
  const sash=plain(0x8d8a82,{rough:.7});
  put({w:2.7,h:.06,d:.06,x:0,y:.68,z:-2.58,mat:sash,tile:1});
  put({w:2.7,h:.06,d:.06,x:0,y:1.99,z:-2.58,mat:sash,tile:1});
  put({w:.05,h:1.31,d:.05,x:0,y:.7,z:-2.58,mat:sash,tile:1});
  // 外の月明かりが窓から
  const winGlow=glow({x:X(0),y:1.35,z:Z(-2.62),s:4.2,sy:2.6,color:0x9fb6dd,op:.16,to:g});
  const winLight=new THREE.PointLight(0x8ba4cc,.55,7,1.8);
  winLight.position.set(X(0),1.5,Z(-2.2));g.add(winLight);
  // カーテン（半分開き）
  put({w:.9,h:1.6,d:.05,x:-1.05,y:.62,z:-2.5,mat:MAT.curtain,tile:1});
  put({w:.9,h:1.6,d:.05,x: 1.05,y:.62,z:-2.5,mat:MAT.curtain,tile:1});

     開ける時は手前の1枚を奥の1枚に重ねて、片側だけを開ける。 */

  put({w:.58,h:1.33,d:.54,x:frx+.04,y:.13,z:frz,mat:linerM,tile:1,cast:false,to:fr});
  addSolid(X(frx),Z(frz),.64,.64,0,list);

    put({w:.50,h:.016,d:.50,x:frx+.02,y:sy,z:frz,mat:shelfM,tile:1,to:fr}));
  put({w:.50,h:.34,d:.50,x:frx+.02,y:.16,z:frz,mat:plain(0xcfd2ce,{rough:.4,op:.9}),tile:1,to:fr});
  put({w:.02,h:.05,d:.22,x:frx+.28,y:.34,z:frz,mat:hwM,tile:1,to:fr});   // 引き出しの取っ手

  /* ---- 布団 ---- 角の丸い形にして、箱に見えないようにする */

  const shikiM=plain(0x9c968a,{rough:.98});
  const kakeM =plain(0x515865,{rough:.99});
  const makuM =plain(0xc8c3b6,{rough:.98});

  // 掛け布団（薄く、少しずれて掛かっている）
  const kake=roundedBox({w:1.04,h:.17,d:1.32,e:.30,seg:22,

  // めくれた折り返し
  const turn=roundedBox({w:1.02,h:.07,d:.28,e:.36,seg:16,

  roundedBox({w:.50,h:.13,d:.29,e:.50,seg:18,x:X(1.35),y:.15,z:Z(-.36),mat:makuM,to:fut});

  /* ---- テレビ台まわり ----

  const boardM=plain(0x53483a,{rough:.72});
  const tvM   =plain(0x24272b,{rough:.55,metal:.25});
  // テレビ台（引き出し2つ）※押し入れと重ならないよう東の壁側に置く
  put({w:.42,h:.40,d:1.05,x:2.42,y:.06,z:-1.75,mat:boardM,tile:1,solid:true});
  put({w:.44,h:.035,d:1.09,x:2.42,y:.46,z:-1.75,mat:plain(0x6a5b48,{rough:.6}),tile:1});
  [-.27,.27].forEach(dz=>{
    put({w:.02,h:.24,d:.46,x:2.20,y:.11,z:-1.75+dz,mat:plain(0x463c30,{rough:.8}),tile:1});

      mat:plain(0x8f8b82,{rough:.4,metal:.6}),tile:1});          // 取っ手

  // テレビ（枠・首・台座・画面）
  put({w:.055,h:.44,d:.76,x:2.40,y:.66,z:-1.75,mat:tvM,tile:1});
  put({w:.05 ,h:.06,d:.10,x:2.40,y:.50,z:-1.75,mat:tvM,tile:1});   // 首
  put({w:.30 ,h:.022,d:.34,x:2.36,y:.495,z:-1.75,mat:tvM,tile:1}); // 台座
  const tv=new THREE.Mesh(new THREE.PlaneGeometry(.70,.40),
    plain(0x0a0c10,{rough:.06,metal:.55}));
  tv.position.set(X(2.368),.665,Z(-1.75));tv.rotation.y=RY(-Math.PI/2);g.add(tv);
  // 待機ランプ
  put({w:.012,h:.012,d:.012,x:2.372,y:.455,z:-2.05,
    mat:plain(0x220806,{em:0x8a1208,ei:1.2,rough:.4}),tile:1});
  // ゲーム機とルーター
  put({w:.22,h:.045,d:.30,x:2.36,y:.495,z:-1.32,mat:plain(0x2b2f34,{rough:.5}),tile:1});
  put({w:.10,h:.16,d:.13,x:2.38,y:.495,z:-2.16,mat:plain(0x33383d,{rough:.6}),tile:1});
  [.53,.57].forEach(y=>put({w:.008,h:.01,d:.01,x:2.33,y:y,z:-2.16,
    mat:plain(0x0a2208,{em:0x3fa02a,ei:1.4,rough:.4}),tile:1}));
  // 電源タップと配線
  put({w:.07,h:.03,d:.24,x:2.52,y:.02,z:-2.10,mat:plain(0xd6d2c8,{rough:.7}),tile:1});
  cy({rt:.006,h:.55,x:2.52,y:.05,z:-1.96,mat:plain(0x1a1c20,{rough:.9}),seg:5,rx:1.35});

  /* ---- 時計・カレンダー ---- */
  const clock=new THREE.Mesh(new THREE.CircleGeometry(.19,24),
    unlit(0xffffff,{map:TEX.clockFace(mirror)}));
  clock.position.set(X(2.68),1.92,Z(.1));clock.rotation.y=RY(-Math.PI/2);g.add(clock);
  const cal=new THREE.Mesh(new THREE.PlaneGeometry(.4,.53),
    unlit(0xffffff,{map:TEX.calendar(mirror)}));
  // 吊戸棚（x2.09〜2.71 / y1.42〜2.42 / z1.05〜2.75）の中に埋まっていたので、時計の真下へ移した
  cal.position.set(X(2.68),1.35,Z(.1));cal.rotation.y=RY(-Math.PI/2);g.add(cal);
  R.clock=clock;

  /* ---- 玄関 ---- */
  const dHinge=new THREE.Group();
  dHinge.position.set(X(-.45),0,Z(3.88));g.add(dHinge);
  const door=new THREE.Mesh(new THREE.BoxGeometry(.9,2.0,.07),
    plain(0x3f4750,{rough:.7,metal:.25}));
  door.position.set(M*.45,1.0,0);door.castShadow=true;dHinge.add(door);
  cy({rt:.02,h:.11,x:.28,y:1.05,z:3.8,mat:plain(0x8a8578,{metal:.7,rough:.5}),rx:Math.PI/2});
  put({w:2.1,h:.1,d:.14,x:0,y:2.0,z:3.86,mat:MAT.dark,tile:1});
  R.door={hinge:dHinge,mesh:door,open:0,pos:new THREE.Vector3(X(0),1.1,Z(3.6))};
  // 靴
  put({w:.24,h:.09,d:.32,x:-.4,y:0,z:3.4,mat:plain(0x2e2a26,{rough:.95}),tile:1});
  put({w:.24,h:.09,d:.32,x:-.05,y:0,z:3.42,mat:plain(0x2e2a26,{rough:.95}),tile:1});
  // 上がり框
  put({w:2.0,h:.08,d:.06,x:0,y:0,z:3.02,mat:MAT.wood,tile:1});

  /* ---- 天井灯 ---- */
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(.34,.42,.26,16,1,true),
    plain(0xd9d3c4,{rough:.9,side:THREE.DoubleSide}));
  shade.position.set(X(0),H-.22,Z(-.9));g.add(shade);
  cy({rt:.012,h:.2,x:0,y:H-.2,z:-.9,mat:MAT.dark,seg:5});
  const bulbP=new THREE.Mesh(new THREE.CircleGeometry(.33,16),unlit(0x3a3630));
  bulbP.rotation.x=Math.PI/2;bulbP.position.set(X(0),H-.35,Z(-.9));g.add(bulbP);
  const ceilL=new THREE.PointLight(0xffdcae,0,9,1.5);
  ceilL.position.set(X(0),H-.4,Z(-.9));g.add(ceilL);
  // 引き紐
  const cord=cy({rt:.006,h:.55,x:.22,y:H-.75,z:-.9,mat:plain(0xcfc8b8),seg:4});
  R.light={pt:ceilL,panel:bulbP,on:false,
    cordPos:new THREE.Vector3(X(.22),1.5,Z(-.9))};
  R.winLight=winLight;R.winGlow=winGlow;

  /* ---- roomB 専用の小道具 ---- */
  if(mirror){
    const wrap=new THREE.Mesh(new THREE.PlaneGeometry(.17,.12),
      plain(0xd8d4c6,{rough:.6,side:THREE.DoubleSide}));
    wrap.rotation.x=-Math.PI/2+.1;
    wrap.position.set(X(-.95),.405,Z(-.42));wrap.visible=true;g.add(wrap);
    const rec=new THREE.Mesh(new THREE.PlaneGeometry(.07,.19),
      plain(0xe6e3d8,{rough:.7,side:THREE.DoubleSide}));
    rec.rotation.x=-Math.PI/2;rec.rotation.z=.5;
    rec.position.set(X(-.72),.404,Z(-.34));g.add(rec);
    R.wrapper=wrap;
  }

  // 部屋の外周（念のため）
  addSolidRect(X(-3.0),Z(-2.8),X(-2.6),Z(4.0),list);
  addSolidRect(X(2.6),Z(-2.8),X(3.0),Z(4.0),list);
  addSolidRect(X(-3.0),Z(-2.85),X(3.0),Z(-2.6),list);
  addSolidRect(X(-3.0),Z(3.85),X(3.0),Z(4.05),list);
  return R;
}

/* =========================================================================
   自販機の内側（最終カット）
   「いま自分が自販機の中にいる」と一目で分かるように、
   ・見本の缶を裏側から見た列
   ・裏返しになった「いつでも つめたい」の文字
   ・窓枠と取り出し口の内側
   を手前に置いて、外の夜道を四角い窓ごしに見せる。
   ========================================================================= */
function buildInsideVend(){
  const p=LOC.vend;
  const g=new THREE.Group();
  g.position.set(p.x+.30,0,p.z+1.0);
  g.visible=false;scOut.add(g);

  const frame=plain(0x0a0b0d,{rough:1});
  const inner=plain(0x191d22,{rough:.85,metal:.2});
  const canM =plain(0x05060a,{rough:.9});

  /* 箱の中にいる感じを出すため、左右・上下・背面を近くで囲む。
     外は正面の細い窓からしか見えない。 */
  box({w:.86,h:2.0,d:.10,x:.02,y:0   ,z:-.62,mat:inner,tile:1,to:g});   // 内側の左壁
  box({w:.86,h:2.0,d:.10,x:.02,y:0   ,z: .62,mat:inner,tile:1,to:g});   // 内側の右壁
  box({w:.86,h:.12,d:1.34,x:.02,y:1.86,z:0  ,mat:inner,tile:1,to:g});   // 天井
  box({w:.86,h:.10,d:1.34,x:.02,y:.02,z:0   ,mat:inner,tile:1,to:g});   // 床
  box({w:.10,h:2.0,d:1.34,x:-.36,y:0 ,z:0   ,mat:plain(0x101317,{rough:.95}),tile:1,to:g}); // 背面
  // 窓枠
  box({w:.07,h:2.0,d:.16,x:.40,y:0   ,z:-.60,mat:frame,tile:1,to:g});
  box({w:.07,h:2.0,d:.16,x:.40,y:0   ,z: .60,mat:frame,tile:1,to:g});
  box({w:.07,h:.46,d:1.30,x:.40,y:1.52,z:0  ,mat:frame,tile:1,to:g});
  box({w:.07,h:.44,d:1.30,x:.40,y:.30 ,z:0  ,mat:frame,tile:1,to:g});
  box({w:.16,h:.10,d:1.30,x:.30,y:1.50,z:0,mat:inner,tile:1,to:g});
  box({w:.16,h:.10,d:1.30,x:.30,y:.66 ,z:0,mat:inner,tile:1,to:g});
  // 内部の縦フレーム（商品コラムの仕切り）
  [-.44,.44].forEach(z=>
    box({w:.05,h:1.20,d:.05,x:.14,y:.60,z:z,mat:plain(0x1f242a,{rough:.8}),tile:1,to:g}));

  // ガラス（内側から見た曇り）
  const glass=new THREE.Mesh(new THREE.PlaneGeometry(1.60,1.00),
    new THREE.MeshStandardMaterial({color:0xaecbe0,transparent:true,opacity:.09,
      roughness:.26,metalness:.2,side:THREE.DoubleSide,depthWrite:false}));
  glass.position.set(.40,1.08,0);glass.rotation.y=-Math.PI/2;g.add(glass);

  /* 見本の缶を裏側から見た列。
     目線の高さ(y≈1.12)の前後は空けて、外の道が四角く見えるようにする。 */
  [.56,1.72].forEach(y=>{
    box({w:.26,h:.02,d:1.30,x:.26,y:y-.07,z:0,mat:canM,tile:1,to:g});   // 棚板
    for(let i=0;i<9;i++)
      cyl({rt:.033,h:.125,x:.26,y:y,z:-.52+i*.13,mat:canM,seg:9,rz:Math.PI/2,center:true,to:g});
    box({w:.02,h:.045,d:1.30,x:.30,y:y-.12,z:0,mat:plain(0x2a2f35,{rough:.8}),tile:1,to:g});
  });

  /* 裏返しになった上部の看板。これが一番はっきりした手がかりになる */
  const revTex=TEX.sign("いつでも つめたい",{size:52,bg:"#3a1416",fg:"#c4a0a2",w:1024,h:256});
  revTex.wrapS=THREE.RepeatWrapping;revTex.repeat.x=-1;revTex.offset.x=1;
  const revSign=new THREE.Mesh(new THREE.PlaneGeometry(1.22,.19),
    unlit(0xffffff,{map:revTex,side:THREE.DoubleSide}));
  revSign.position.set(.35,1.42,0);revSign.rotation.y=-Math.PI/2;g.add(revSign);

  /* 取り出し口の内側（足元の暗がり） */
  box({w:.30,h:.30,d:.70,x:.18,y:.02,z:-.06,mat:plain(0x030405,{rough:1}),tile:1,to:g});
  box({w:.05,h:.04,d:.72,x:.34,y:.30,z:-.06,mat:inner,tile:1,to:g});

  /* 硬貨機構の箱（横） */
  box({w:.22,h:.62,d:.20,x:.08,y:.72,z:.62,mat:inner,tile:1,to:g});
  box({w:.24,h:.06,d:.22,x:.08,y:1.34,z:.62,mat:plain(0x2d3238,{rough:.7}),tile:1,to:g});

  /* 内側のかすかな照明（機械は死んでいるので、ごく弱く） */
  const L=new THREE.PointLight(0x9fc4e0,1.05,2.6,1.6);
  L.position.set(.02,1.50,0);g.add(L);
  G.insideVend={group:g,light:L,
    camPos:new THREE.Vector3(p.x+.10,1.12,p.z+1.0)};

  /* -----------------------------------------------------------------
     最後に前を通り過ぎる人影。ただの通行人で、こちらには気づかない。
     膝と肘を持たせて、歩き方でそれと分かるようにする。
     ----------------------------------------------------------------- */
  const w=new THREE.Group();
  w.visible=false;scOut.add(w);
  /* 深夜にコンビニへ行くときの、ラフな格好。
     逆光でほぼ影になるが、光が当たったときに服だと分かる程度の色を持たせる。 */
  const hoodM =plain(0x2a2f36,{rough:.95});   // パーカー
  const pantM =plain(0x33373d,{rough:.95});   // スウェット
  const shoeM =plain(0x5d636b,{rough:.75});   // スニーカー
  const soleM =plain(0x8f959c,{rough:.7});
  const skinM =plain(0x6a5346,{rough:.85});   // 肌
  const hairM =plain(0x16171a,{rough:1});
  const bagM  =plain(0xb9bcb8,{rough:.72,op:.94});
  const rb=(ww,hh,dd,e,x,y,z,par,mat)=>{
    const m=new THREE.Mesh(roundedBoxGeo(ww,hh,dd,e,14),mat||hoodM);
    m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=false;
    par.add(m);return m;
  };
  const hips=new THREE.Group();hips.position.set(0,.88,0);w.add(hips);
  rb(.36,.22,.24,.5,0,.03,0,hips,hoodM);                  // 腰（パーカーの裾）
  const torso=rb(.40,.58,.26,.5,0,.33,0,hips,hoodM);      // 胴（少しゆったり）
  torso.rotation.x=.05;
  rb(.41,.05,.27,.5,0,.05,0,hips,plain(0x22262b,{rough:.95}));  // 裾のリブ
  const sh=new THREE.Group();sh.position.set(0,.56,0);hips.add(sh);
  rb(.44,.16,.25,.45,0,.03,0,sh,hoodM);                   // 肩
  rb(.32,.15,.20,.6,0,.09,-.10,sh,hoodM);                 // 首の後ろのフード
  rb(.10,.10,.10,.7,0,.12,.01,sh,skinM);                  // 首
  rb(.20,.245,.21,.7,0,.27,.005,sh,skinM);                // 頭
  rb(.215,.15,.20,.75,0,.335,-.015,sh,hairM);             // 髪
  const arms=[],legs=[];
  [-1,1].forEach(sd=>{
    const pv=new THREE.Group();pv.position.set(sd*.225,.02,0);sh.add(pv);
    rb(.115,.115,.12,.8,0,0,0,pv,hoodM);                  // 肩
    rb(.108,.31,.118,.55,0,-.155,0,pv,hoodM);             // 二の腕（袖）
    const el=new THREE.Group();el.position.set(0,-.30,0);pv.add(el);
    rb(.104,.104,.108,.8,0,0,0,el,hoodM);                 // 肘
    rb(.096,.26,.104,.55,0,-.13,0,el,hoodM);              // 前腕（袖）
    rb(.088,.05,.096,.7,0,-.255,0,el,plain(0x22262b,{rough:.95}));  // 袖口
    const hand=rb(.075,.11,.070,.75,0,-.325,.01,el,skinM);
    arms.push({pivot:pv,elbow:el,hand:hand});
  });
  [-1,1].forEach(sd=>{
    const pv=new THREE.Group();pv.position.set(sd*.102,-.02,0);hips.add(pv);
    rb(.16,.16,.175,.8,0,0,0,pv,pantM);                   // 股関節
    rb(.152,.47,.178,.5,0,-.235,0,pv,pantM);              // 太もも（ゆったり）
    const kn=new THREE.Group();kn.position.set(0,-.45,0);pv.add(kn);
    rb(.142,.142,.163,.8,0,0,0,kn,pantM);                 // 膝
    rb(.132,.42,.152,.5,0,-.21,0,kn,pantM);               // すね
    rb(.128,.06,.155,.6,0,-.40,0,kn,plain(0x22262b,{rough:.95})); // 裾のリブ
    rb(.115,.075,.26,.55,0,-.455,.050,kn,shoeM);          // スニーカー
    rb(.118,.028,.265,.5,0,-.492,.052,kn,soleM);          // ソール
    legs.push({pivot:pv,knee:kn});
  });
  // コンビニの袋（この人も、同じ道を帰るところ）
  const bag=new THREE.Group();bag.position.set(0,-.38,0);arms[1].elbow.add(bag);
  rb(.21,.28,.14,.45,0,-.16,0,bag,bagM);
  rb(.05,.11,.03,.7,-.055,-.02,0,bag,bagM);
  rb(.05,.11,.03,.7,.055,-.02,0,bag,bagM);
  G.walker={group:w,hips:hips,arms:arms,legs:legs,bag:bag,
            t:0,ph:0,on:false,
            z0:p.z-9,z1:p.z+8,x:p.x+3.0,dur:9.0,rate:4.76};
}

  if(e.code==="Escape"&&STORY.started&&!STORY.ended)togglePause(true);
  if(e.code==="KeyE")tryInteract();
  if(e.code==="Space")e.preventDefault();
});
