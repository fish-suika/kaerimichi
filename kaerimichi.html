/* ポインタロックは使えない環境がある（埋め込みフレーム、data: URL など）。
   新しめの Chrome は Promise を返すので、拒否されても握りつぶす。 */
function lockPointer(){
  if(MOBILE||!canvas.requestPointerLock)return;
  try{
    const p=canvas.requestPointerLock();
    if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
canvas.addEventListener("click",()=>{
  if(MOBILE)return;                    // スマホはポインタロックを使わない
  if(!STORY.started||paused||STORY.ended)return;
  if(!locked)lockPointer();
});
document.addEventListener("pointerlockchange",()=>{
  locked=(document.pointerLockElement===canvas);
  if(!locked&&STORY.started&&!paused&&!STORY.ended)togglePause(true);
});
addEventListener("mousemove",e=>{
  if(!PL.canLook)return;
  if(locked){
    PL.yaw-=e.movementX*.0022*mouseSens;
    PL.pitch-=e.movementY*.0022*mouseSens;
  }else if(dragging){
    PL.yaw-=e.movementX*.0030*mouseSens;
    PL.pitch-=e.movementY*.0030*mouseSens;
  }
  PL.pitch=clamp(PL.pitch,-1.35,1.35);
});
// ポインタロックが使えない環境向けのドラッグ操作
canvas.addEventListener("mousedown",()=>{if(!locked)dragging=true;});
addEventListener("mouseup",()=>{dragging=false;});

/* ---------- UI ---------- */
const UI={
  fadeEl:$("fade"),subEl:$("sub"),objEl:$("obj"),objT:$("objt"),
  promptEl:$("prompt"),promptT:$("promptt"),crossEl:$("cross"),hintEl:$("hint"),
  actEl:$("act"),
  q:[],cur:null,curT:0
};
function fadeTo(v,sec){
  UI.fadeEl.style.transition="opacity "+(sec==null?1:sec)+"s linear";
  UI.fadeEl.style.opacity=v;
}
function say(text,dur){UI.q.push({t:text,d:dur||Math.max(2.4,1.6+Array.from(text).length*.13)});}
function sayNow(text,dur){UI.q.length=0;UI.cur=null;UI.subEl.classList.remove("on");say(text,dur);}
function clearSay(){UI.q.length=0;UI.cur=null;UI.subEl.classList.remove("on");}
function updateSay(dt){
  if(UI.cur){
    UI.curT-=dt;
    if(UI.curT<=0){UI.subEl.classList.remove("on");UI.cur=null;UI.curT=.9;}
    return;
  }
  if(UI.curT>0){UI.curT-=dt;return;}
  if(UI.q.length){
    UI.cur=UI.q.shift();
    UI.subEl.textContent=UI.cur.t;
    UI.subEl.classList.add("on");
    UI.curT=UI.cur.d;
  }
}
let objTimer=0;
function setObjective(t){
  if(t===null||t===""){UI.objEl.classList.remove("on");return;}
  UI.objT.textContent=t;
  UI.objEl.classList.add("on");
}
function hint(t){
  UI.hintEl.textContent=t;
  UI.hintEl.classList.add("on");
  clearTimeout(hint._t);
  hint._t=setTimeout(()=>UI.hintEl.classList.remove("on"),5200);
}

/* ---------- インタラクト ---------- */
let curInt=null;
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3();
function updateInteract(){
  let best=null,bd=1e9;
  camera.getWorldDirection(_v1);
  for(let i=0;i<INTERACT.length;i++){
    const it=INTERACT[i];
    if(it.on&&!it.on())continue;
    const d=it.pos.distanceTo(PL.pos);
    if(d>it.r)continue;
    _v2.subVectors(it.pos,camera.position).normalize();
    if(_v1.dot(_v2)<(it.face==null?.5:it.face))continue;
    if(d<bd){bd=d;best=it;}
  }
  if(!PL.canMove&&!(best&&best.always))best=null;
  curInt=best;
  if(best){
    UI.promptT.textContent=best.label||"調べる";
    UI.promptEl.classList.add("on");
    UI.crossEl.classList.add("hot");
    UI.actEl.classList.add("on");          // スマホの「調べる」ボタン
  }else{
    UI.promptEl.classList.remove("on");
    UI.crossEl.classList.remove("hot");
    UI.actEl.classList.remove("on");
  }
}
function tryInteract(){
  if(!curInt||paused||!STORY.started)return;
  const it=curInt;
  UI.promptEl.classList.remove("on");
  UI.crossEl.classList.remove("hot");
  UI.actEl.classList.remove("on");
  curInt=null;
  it.fn(it);
}

/* ---------- 移動 ---------- */
function collideXZ(x,z,r,list){
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<list.length;i++){
      const s=list[i];
      if(x>s.x0-r&&x<s.x1+r&&z>s.z0-r&&z<s.z1+r){
        const dl=x-(s.x0-r),dr=(s.x1+r)-x,dt=z-(s.z0-r),db=(s.z1+r)-z;
        const m=Math.min(dl,dr,dt,db);
        if(m===dl)x=s.x0-r;else if(m===dr)x=s.x1+r;
        else if(m===dt)z=s.z0-r;else z=s.z1+r;
      }
    }
  }
  return [x,z];
}
/* 歩幅は速く動くほど伸びる（実際の歩き〜小走りと同じ）。
   歩数/秒 = 速度 ÷ 歩幅 なので、速度を上げても足音のテンポが暴走しない。
     1.7m/s → 歩幅0.94m・1.8歩/秒（歩き）
     3.3m/s → 歩幅1.15m・2.9歩/秒（小走り）        */
function strideOf(sp){return .72+.13*sp;}
let stepPhase=0,stepFoot=0;
function surfaceAt(){
  if(scene===scIn){
    const rz=PL.pos.z-(G.roomB&&G.roomB.group.visible?-40:0);
    return rz<.8?"tatami":"wood";
  }
  const p=LOC.park;
  if(PL.pos.x>p.x-18&&PL.pos.x<p.x+5&&PL.pos.z>p.z-12&&PL.pos.z<p.z+12)return "gravel";
  return "asphalt";
}
function footstep(){
  const s=surfaceAt();
  const key=s==="tatami"?"stepTatami":(s==="wood"?"stepWood":(s==="gravel"?"stepGravel":"step"));
  stepFoot^=1;                       // 左右で少しだけ音を変える
  const base=s==="asphalt"?.40:.34;
  SND.play(key,{
    vol:base*(stepFoot?1:.88)*rr(.92,1.06),
    rate:(stepFoot?1:.975)*rr(.95,1.05),
    pan:(stepFoot?.20:-.20)
  });
}
function updatePlayer(dt){
  const list=(scene===scIn)?SOLID.in:SOLID.out;

  /* 強制移動（演出用） */
  if(PL.force){
    const f=PL.force;
    _v1.subVectors(f.to,PL.pos);_v1.y=0;
    const d=_v1.length();
    if(d<.12){PL.force=null;if(f.done)f.done();}
    else{
      _v1.normalize().multiplyScalar(Math.min(f.spd*dt,d));
      PL.pos.add(_v1);
      PL.bob+=f.spd*dt*Math.PI/strideOf(f.spd);PL.bobAmt=damp(PL.bobAmt,1,6,dt);
      const ph=Math.floor(PL.bob/Math.PI);
      if(ph!==stepPhase){stepPhase=ph;footstep();}
    }
  }else if(PL.canMove){
    let ix=0,iz=0;
    if(KEY.KeyW||KEY.ArrowUp)iz-=1;
    if(KEY.KeyS||KEY.ArrowDown)iz+=1;
    if(KEY.KeyA||KEY.ArrowLeft)ix-=1;
    if(KEY.KeyD||KEY.ArrowRight)ix+=1;
    // タッチの仮想スティックは倒し幅がそのまま速さになる
    if(TOUCH.mx||TOUCH.mz){ix+=TOUCH.mx;iz+=TOUCH.mz;}
    PL.running=(!!(KEY.ShiftLeft||KEY.ShiftRight)||TOUCH.run)&&iz<=0;
    const len=Math.hypot(ix,iz);
    let tx=0,tz=0;
    if(len>0){
      const amt=Math.min(1,len);        // キーは常に1、スティックは0〜1
      ix/=len;iz/=len;
      const spd=(PL.running?4.20:3.30)*amt;
      const s=Math.sin(PL.yaw),c=Math.cos(PL.yaw);
      tx=(ix*c+iz*s)*spd;
      tz=(-ix*s+iz*c)*spd;
    }
    PL.vx=damp(PL.vx,tx,11,dt);
    PL.vz=damp(PL.vz,tz,11,dt);
    PL.pos.x+=PL.vx*dt;PL.pos.z+=PL.vz*dt;

    const sp=Math.hypot(PL.vx,PL.vz);
    PL.bobAmt=damp(PL.bobAmt,sp>.25?1:0,7,dt);
    PL.bob+=sp*dt*Math.PI/strideOf(sp);
    const ph=Math.floor(PL.bob/Math.PI);
    if(ph!==stepPhase&&sp>.5){stepPhase=ph;footstep();}
    else if(ph!==stepPhase)stepPhase=ph;
  }else{
    PL.vx=damp(PL.vx,0,12,dt);PL.vz=damp(PL.vz,0,12,dt);
    PL.bobAmt=damp(PL.bobAmt,0,6,dt);
  }

  if(!PL.noClip){
    const c=collideXZ(PL.pos.x,PL.pos.z,.36,list);
    PL.pos.x=c[0];PL.pos.z=c[1];
  }

  /* 強制注視 */
  if(PL.lookAt){
    _v1.subVectors(PL.lookAt.v,camera.position);
    const ty=Math.atan2(-_v1.x,-_v1.z);
    const tp=Math.atan2(_v1.y,Math.hypot(_v1.x,_v1.z));
    let dy=ty-PL.yaw;
    while(dy>Math.PI)dy-=Math.PI*2;
    while(dy<-Math.PI)dy+=Math.PI*2;
    PL.yaw+=dy*Math.min(1,PL.lookAt.k*dt);
    PL.pitch+=(tp-PL.pitch)*Math.min(1,PL.lookAt.k*dt);
  }

  /* カメラ */
  PL.eye=damp(PL.eye,PL.height-PL.sit,7,dt);
  const b=Math.sin(PL.bob*2)*.026*PL.bobAmt;
  const sway=Math.cos(PL.bob)*.022*PL.bobAmt;
  PL.roll=damp(PL.roll,sway*.5,8,dt);
  camera.position.set(PL.pos.x+Math.cos(PL.yaw)*sway*.1,PL.pos.y+PL.eye+b,PL.pos.z);
  camera.rotation.set(PL.pitch,PL.yaw,PL.roll,"YXZ");
}

/* ---------- ポーズ ---------- */
function togglePause(on){
  paused=on;
  document.body.classList.toggle("paused",on);
  const el=$("pause");
  if(on){
    el.classList.remove("gone");
    requestAnimationFrame(()=>el.classList.remove("hide"));
    if(document.exitPointerLock)document.exitPointerLock();
    SND.duck(.25,.25);
  }else{
    el.classList.add("hide");
    setTimeout(()=>el.classList.add("gone"),400);
    SND.duck(1,.35);
    lockPointer();
  }
}
$("resumeBtn").onclick=()=>togglePause(false);
function bindSlider(id,out,fn){
  const s=$(id),o=$(out);
  const upd=()=>{o.textContent=s.value;fn(+s.value);};
  s.oninput=upd;upd();
}
/* =========================================================================
   6.5 TOUCH — スマホ・タブレットの操作
   左半分＝指を置いた場所に出る仮想スティックで移動（深く倒すと急ぐ）。
   右半分＝なぞって視点、ほとんど動かさずに離したら「調べる」。
   タッチ側で preventDefault するので合成マウスイベントは飛ばず、
   既存のマウス処理（ドラッグ視点・ポインタロック）と二重に効くことはない。
   ========================================================================= */
const TOUCH={mx:0,mz:0,run:false,moveId:null,lookId:null,
             ox:0,oy:0,lx:0,ly:0,lt:0,lmoved:0};
const STICK_R=58;                       // スティックを倒しきる距離(px)

(function(){
  const stick=$("stick"),knob=$("knob");
  const live=()=>STORY.started&&!paused&&!STORY.ended;

  function hideStick(){
    stick.classList.remove("on");
    TOUCH.mx=0;TOUCH.mz=0;TOUCH.run=false;
  }

  canvas.addEventListener("touchstart",e=>{
    e.preventDefault();
    document.body.classList.add("touch");
    if(!live())return;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.clientX<innerWidth*.5){
        if(TOUCH.moveId!==null)continue;
        TOUCH.moveId=t.identifier;TOUCH.ox=t.clientX;TOUCH.oy=t.clientY;
        stick.style.left=t.clientX+"px";stick.style.top=t.clientY+"px";
        knob.style.transform="translate(0,0)";
        stick.classList.add("on");
      }else{
        if(TOUCH.lookId!==null)continue;
        TOUCH.lookId=t.identifier;TOUCH.lx=t.clientX;TOUCH.ly=t.clientY;
        TOUCH.lt=performance.now();TOUCH.lmoved=0;
      }
    }
  },{passive:false});

  canvas.addEventListener("touchmove",e=>{
    e.preventDefault();
    if(!live())return;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier===TOUCH.moveId){
        let dx=t.clientX-TOUCH.ox,dy=t.clientY-TOUCH.oy;
        const d=Math.hypot(dx,dy)||1;
        if(d>STICK_R){dx*=STICK_R/d;dy*=STICK_R/d;}
        knob.style.transform="translate("+dx.toFixed(1)+"px,"+dy.toFixed(1)+"px)";
        const m=Math.min(1,d/STICK_R);
        if(m<.16){                       // デッドゾーン
          TOUCH.mx=0;TOUCH.mz=0;TOUCH.run=false;
        }else{
          const k=Math.hypot(dx,dy)||1;
          TOUCH.mx=dx/k*m;               // 画面の上＝前（iz は前が負）
          TOUCH.mz=dy/k*m;
          TOUCH.run=m>.86&&dy<0;
        }
      }else if(t.identifier===TOUCH.lookId){
        const dx=t.clientX-TOUCH.lx,dy=t.clientY-TOUCH.ly;
        if(PL.canLook){
          PL.yaw-=dx*.0040*mouseSens;
          PL.pitch=clamp(PL.pitch-dy*.0040*mouseSens,-1.35,1.35);
        }
        TOUCH.lmoved+=Math.abs(dx)+Math.abs(dy);
        TOUCH.lx=t.clientX;TOUCH.ly=t.clientY;
      }
    }
  },{passive:false});

  const end=e=>{
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier===TOUCH.moveId){TOUCH.moveId=null;hideStick();}
      else if(t.identifier===TOUCH.lookId){
        // ほとんど動かさずに離した＝タップ。狙っている物があれば調べる
        if(live()&&TOUCH.lmoved<14&&performance.now()-TOUCH.lt<340)tryInteract();
        TOUCH.lookId=null;
      }
    }
  };
  canvas.addEventListener("touchend",end,{passive:false});
  canvas.addEventListener("touchcancel",end,{passive:false});

  $("act").addEventListener("click",()=>tryInteract());
  $("menu").addEventListener("click",()=>{
    if(STORY.started&&!STORY.ended)togglePause(!paused);
  });
})();

/* 全画面＋横向き固定。iPhone の Safari は全画面に入れないので、失敗しても構わない */
function goFullscreen(){
  const el=document.documentElement;
  const rf=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!rf)return;
  try{
    Promise.resolve(rf.call(el)).then(()=>{
      if(screen.orientation&&screen.orientation.lock)
        screen.orientation.lock("landscape").catch(()=>{});
    }).catch(()=>{});
  }catch(e){}
}
/* =========================================================================
   7. STORY — 進行と怪異
   ========================================================================= */
const STORY={started:false,ended:false,phase:"",flags:{},timers:[],t:0};
const AMB={};
const EV={
  park:{state:0,t:0,amp:0,per:2.6,creak:null,seen:false},
  vend:{armed:false,t:0,stage:0,flick:0},
  trash:{shown:false,t:0,grow:0,trail:0},
  fin:{}
};
function after(sec,fn){STORY.timers.push({t:sec,fn:fn});}
function updateTimers(dt){
  for(let i=STORY.timers.length-1;i>=0;i--){
    const T=STORY.timers[i];
    T.t-=dt;
    if(T.t<=0){STORY.timers.splice(i,1);T.fn();}
  }
}
const ZONES=[];
function zone(x,z,r,fn,cond){ZONES.push({x:x,z:z,r2:r*r,fn:fn,cond:cond,done:false});}
function updateZones(){
  for(let i=0;i<ZONES.length;i++){
    const Zz=ZONES[i];
    if(Zz.done)continue;
    if(Zz.cond&&!Zz.cond())continue;
    const dx=PL.pos.x-Zz.x,dz=PL.pos.z-Zz.z;
    if(dx*dx+dz*dz<Zz.r2){Zz.done=true;Zz.fn();}
  }
}
function dist2D(v){return Math.hypot(PL.pos.x-v.x,PL.pos.z-v.z);}
function lookingAt(v,th){
  camera.getWorldDirection(_v1);
  _v2.subVectors(v,camera.position).normalize();
  return _v1.dot(_v2)>(th==null?.72:th);
}

/* ---------------- 環境音 ---------------- */
/* 虫の声は人によって耳につくので、中断メニューから音量を変えられるようにする。
   BUG.level が実際に掛かる倍率、BUG.want がその場面で鳴らしたい大きさ。 */
const BUG={level:.35,want:0};
function bugVol(v,tm){
  BUG.want=v;
  if(AMB.crickets)AMB.crickets.vol(v*BUG.level,tm==null?2.5:tm);
}
function setBugLevel(v){
  BUG.level=v;
  if(AMB.crickets)AMB.crickets.vol(BUG.want*BUG.level,.25);
}
function ambienceOutdoor(on,fast){
  const tm=fast?.4:2.5;
  if(on){
    if(!AMB.crickets)AMB.crickets=SND.loop("crickets",{vol:0,amb:true});
    if(!AMB.wind)AMB.wind=SND.loop("wind",{vol:0,amb:true});
    bugVol(1.0,tm);AMB.wind.vol(.34,tm);
    if(!AMB.vend&&G.vend)
      AMB.vend=SND.loop("vendHum",{vol:.7,amb:true,pos:G.vend.knockPos,ref:2.6,roll:1.9});
    scheduleCar();
  }else{
    bugVol(0,tm);
    if(AMB.wind)AMB.wind.vol(0,tm);
    if(AMB.vend)AMB.vend.vol(0,tm);
  }
}
function scheduleCar(){
  if(STORY.ended)return;
  after(rr(28,70),()=>{
    if(scene===scOut&&!STORY.ended&&STORY.phase!=="vend")
      SND.play("carPass",{vol:rr(.16,.3),amb:true});
    scheduleCar();
  });
}

function armReturn(){
  // 帰り道用の「小さな違和感」を仕込む
  // カーブミラーが壁を向いている
  // （カーブミラーは撤去）
  // 倒れた自転車
  if(G.bikes&&G.bikes[1]){
    G.bikes[1].rotation.z=Math.PI*.42;
    G.bikes[1].position.y=.3;
  }
  // ついていた窓の明かりが消えている
  if(G.litWindows)G.litWindows.forEach((w,i)=>{
    if(i%2===0){w.mesh.material=MAT.winDark;w.glow.material.opacity=0;}
  });
  // コンビニの灯りは、少し離れたところで落ちる（振り返ると暗い）
  zone(-13,-124.5,9,()=>{
    after(1.0,storeLightsOut);
  },()=>STORY.phase==="back");
}
function storeLightsOut(){
  if(!G.store||!G.store.lit)return;
  G.store.lit=false;
  G.store.lightSpecs.forEach(s=>{s.inten=0;s.on=false;});
  G.store.group.traverse(o=>{
    if(o.isMesh&&o.material&&o.material.isMeshBasicMaterial)o.material.color.multiplyScalar(.05);
    if(o.isSprite)o.material.opacity*=.06;
  });
  if(AMB.fluor){AMB.fluor.stop(1.2);AMB.fluor=null;}
  SND.play("click",{vol:.25,pos:LOC.store,ref:9,roll:.9});
}
function vendLightsOut(){
  if(!G.vend.lit)return;
  G.vend.lit=false;
  G.vend.spec.inten=0;G.vend.spec.on=false;
  G.vend.A.glow.material.opacity=0;
  G.vend.A.face.material.map=TEX.vendFront(true);
  G.vend.A.face.material.needsUpdate=true;
  G.vend.A.top.material.color.setHex(0x1a1d22);
  if(AMB.vend)AMB.vend.vol(0,1.4);
  bugVol(0,.6);
  after(2.6,()=>bugVol(1.0,3.5));
}

/* ---------------- 帰り道の怪異：毎フレーム処理 ---------------- */
function updateEvents(dt){
  if(STORY.phase!=="back"&&STORY.phase!=="out")return;

  /* ---- 公園のブランコ ---- */
  const P=EV.park,sw=G.park;
  if(STORY.phase==="back"){
    const d=dist2D(sw.swingPos);
    if(P.state===0&&d<30){
      P.state=1;P.amp=0;P.t=0;P.per=2.55;
      P.creak=SND.loop("swing",{vol:0,amb:true,pos:sw.swingPos,ref:4,roll:1.5});
      P.creak.vol(.36,3);
    }
    if(P.state===1){
      P.amp=damp(P.amp,.52,.7,dt);
      if(d<7.5){                          // 近づくと、ぴたりと止まる
        P.state=2;P.t=0;
        if(P.creak)P.creak.vol(0,.35);
        SND.duck(.4,.6);
        after(1.0,()=>SND.duck(1,2.2));
        after(1.4,()=>{if(!STORY.flags.swingLooked)say("……止まった。");});
        setObjective("アパートへ帰る");
      }
    }
    if(P.state===2){
      P.amp=damp(P.amp,0,9,dt);           // 惰性ではなく、押さえつけられたように止まる
      P.t+=dt;
      if(P.t>3&&d>17){                    // 離れると、また揺れ出す
        P.state=3;P.t=0;P.per=1.95;
        if(P.creak)P.creak.vol(.46,1.2).rate(1.28,1.2);
      }
    }
    if(P.state===3){
      P.amp=damp(P.amp,.86,1.1,dt);
      P.t+=dt;
      if(!P.seen&&lookingAt(sw.swingPos,.86)&&d<40){
        P.seen=true;
        say("……また、揺れてる。");
        after(4.0,()=>{P.state=4;P.t=0;});
      }
      if(P.t>14){P.state=4;P.t=0;}
    }
    if(P.state===4){
      // ゆっくり止まっていく（ここで state を進めてしまうと減衰が止まる）
      P.amp=damp(P.amp,0,1.15,dt);
      if(P.creak&&!P.fading){
        P.fading=true;
        P.creak.vol(0,2.2);
        after(2.6,()=>{if(P.creak){P.creak.stop(.2);P.creak=null;}});
      }
      if(P.amp<.004){P.amp=0;P.state=5;}
    }
    if(P.state===5&&P.amp!==0){P.amp=0;}
  }
  if(P.amp>.0005){
    P.t+=dt;
    const a=Math.sin(P.t*Math.PI*2/P.per)*P.amp;
    sw.seats[0].pivot.rotation.x=a;
    sw.seats[1].pivot.rotation.x=a*.12;   // 隣は、ほとんど動かない
  }

  /* ---- 自動販売機 ---- */
  const V=EV.vend;
  if(STORY.phase==="back"&&G.vend.lit){
    const d=dist2D(G.vend.knockPos);
    if(!V.armed&&d<26&&EV.park.state>=2){
      V.armed=true;V.t=2.0;V.stage=1;
    }
    if(V.armed&&V.stage<4){
      V.t-=dt;
      if(V.t<=0){
        V.t=rr(3.6,5.4);
        SND.play(RND()<.3?"knock3":"knock2",
          {vol:.85,pos:G.vend.knockPos,ref:1.8,roll:1.5,rate:rr(.97,1.03)});
      }
      if(d<6&&!STORY.flags.vendHint){
        STORY.flags.vendHint=true;
        setObjective("音の正体を確かめる");
        say("……中から？");
      }
    }
  }
  // 調べたあとの明滅
  if(V.flick>0){
    V.flick-=dt;
    const on=Math.random()>.45;
    G.vend.spec.inten=on?3.6:.6;
    G.vend.A.glow.material.opacity=on?.42:.08;
    if(V.flick<=0){G.vend.spec.inten=3.6;G.vend.A.glow.material.opacity=.42;}
  }

  /* ---- ゴミ捨て場 ---- */
  const T=EV.trash;
  if(STORY.phase==="back"&&!T.shown&&dist2D(LOC.trash)<19){
    T.shown=true;
    G.trash.pool.visible=true;
    T.dripT=1.2;
    if(EV.vend.stage>=1)setObjective("アパートへ帰る");
  }
  if(T.shown){
    const target=T.grow?2.6:1.05;
    const s=damp(G.trash.pool.scale.x,target,T.grow?.9:1.6,dt);
    G.trash.pool.scale.set(s,s,s);
    T.dripT-=dt;
    if(T.dripT<=0){
      T.dripT=rr(1.6,3.8);
      SND.play("drip",{vol:.5,pos:G.trash.group.position,ref:2.2,roll:1.6,rate:rr(.9,1.1)});
    }
    if(T.grow&&!T.bagMoved){
      T.bagMoved=true;
      const b=G.trash.bags[2];
      let k=0;
      const iv=setInterval(()=>{
        k++;b.rotation.z+=.02;b.position.y-=.004;
        if(k>26)clearInterval(iv);
      },33);
    }
    if(T.trail){
      // 帯の描画範囲を少しずつ伸ばし、先端にふくらみを置いて「流れ」に見せる
      const tr=G.trash.trail;
      tr.mesh.visible=true;
      tr.t=Math.min(1,tr.t+dt*.155);
      const fi=tr.t*(tr.N-1);
      tr.mesh.geometry.setDrawRange(0,Math.max(1,Math.floor(fi))*6);
      const i0=Math.min(tr.N-2,Math.floor(fi)),f=fi-i0;
      tr.head.visible=tr.t<1;
      tr.head.position.set(lerp(tr.pts[i0][0],tr.pts[i0+1][0],f),.0425,
                           lerp(tr.pts[i0][1],tr.pts[i0+1][1],f));
      const hs=.7+.5*Math.sin(STORY.t*3.1);
      tr.head.scale.set(hs,1.15,1);
    }
  }
}

/* ---------- 逐次ビルド（タイトル画面を描かせながら） ---------- */
const BOOT=[
  ["世界を組み立てています",()=>{initMats();buildSky();buildPool();}],
  ["夜道を敷いています",   ()=>{buildWorld();}],
  ["部屋を用意しています", ()=>{buildInteriors();buildInsideVend();}],
  ["音を作っています",     ()=>{SND.init();}],
  ["仕上げています",       ()=>{
      registerInteractions();setupZones();
      renderer.compile(scOut,camera);
      renderer.compile(scIn,camera);
  }]
];
let bootStep=0;
// タブが裏にあると requestAnimationFrame が止まるので、必ず進むようにする
function nextFrame(fn){
  let done=false;
  const go=()=>{if(done)return;done=true;fn();};
  requestAnimationFrame(go);
  setTimeout(go,240);
}
function bootTick(){
  if(bootStep<BOOT.length){
    $("startBtn").textContent=BOOT[bootStep][0]+"…";
    nextFrame(()=>{
      try{BOOT[bootStep][1]();}
      catch(e){console.error("boot stage "+bootStep,e);$("startBtn").textContent="エラー";throw e;}
      bootStep++;
      bootTick();
    });
  }else{
    const b=$("startBtn");
    b.textContent="歩きはじめる";
    b.disabled=false;
    b.onclick=()=>{
      SND.resume();
      if(MOBILE)goFullscreen();          // タップの中でないと全画面に入れない
      const t=$("title");
      t.classList.add("hide");
      setTimeout(()=>t.classList.add("gone"),900);
      startGame();
    };
  }
}
nextFrame(bootTick);

/* ---------- 設定 ---------- */
bindSlider("sVol","oVol",v=>SND.setVolume(v/125));
bindSlider("sGam","oGam",v=>{renderer.toneMappingExposure=v/100;});
bindSlider("sBug","oBug",v=>setBugLevel(v/100));
bindSlider("sSens","oSens",v=>{mouseSens=v/100;});
$("againBtn").onclick=()=>location.reload();

/* ---------- 演出まわりの毎フレーム更新 ---------- */
function updateProps(dt){
  // 冷蔵庫の扉
  [G.roomA,G.roomB].forEach(R=>{
    if(!R)return;
    const f=R.fridge;
    const tgt=(f.open||0)*1.75*(R.mirror?-1:1);
    f.hinge.rotation.y=damp(f.hinge.rotation.y,tgt,4.5,dt);
    const lit=(f.open||0)*.9;
    f.light.intensity=damp(f.light.intensity,lit,5,dt);
    f.glow.material.opacity=damp(f.glow.material.opacity,lit*.5,5,dt);
    // 襖
    R.fusuma.forEach(fu=>{
      if(fu.userData.slide==null)return;
      fu.position.z=damp(fu.position.z,fu.userData.baseZ+fu.userData.slide,2.6,dt);
    });
  });
  // 通行人（膝と肘を曲げて歩かせる）
  const W=G.walker;
  if(W&&W.on){
    W.t+=dt;
    W.ph=W.t*W.rate;
    const p=clamp(W.t/W.dur,0,1),s=Math.sin(W.ph);
    W.group.visible=true;
    W.group.position.set(W.x,Math.abs(Math.cos(W.ph))*.021,lerp(W.z0,W.z1,p));
    W.legs[0].pivot.rotation.x= s*.42;
    W.legs[1].pivot.rotation.x=-s*.42;
    // 膝は後ろにしか曲がらない
    W.legs[0].knee.rotation.x=Math.max(0,-Math.sin(W.ph-.7))*.95;
    W.legs[1].knee.rotation.x=Math.max(0,-Math.sin(W.ph+Math.PI-.7))*.95;
    W.arms[0].pivot.rotation.x=-s*.30;
    W.arms[1].pivot.rotation.x= s*.24;
    W.arms[0].elbow.rotation.x=.24+Math.max(0, s)*.26;
    W.arms[1].elbow.rotation.x=.30+Math.max(0,-s)*.16;
    W.hips.rotation.y=Math.sin(W.ph)*.045;
    if(W.bag)W.bag.rotation.x=-W.arms[1].pivot.rotation.x-W.arms[1].elbow.rotation.x
                              +Math.sin(W.ph*2)*.06;
    if(p>=1){W.on=false;W.group.visible=false;}
  }
  // 星のゆるやかな回転
  if(G.stars)G.stars.rotation.y+=dt*.004;
  // フィルムグレイン
  const gr=$("grain");
  gr.style.backgroundPosition=(Math.random()*120|0)+"px "+(Math.random()*120|0)+"px";
}

/* ---------- メインループ ---------- */
const clock=new THREE.Clock();
let acc=0;
function loop(){
  requestAnimationFrame(loop);
  let dt=clock.getDelta();
  if(dt>.1)dt=.1;
  if(!paused){
    STORY.t+=dt;
    updateTimers(dt);
    if(STORY.started){
      updateZones();
      updateEvents(dt);
    }
    updatePlayer(dt);
    updateInteract();
    updateProps(dt);
  }
  updateSay(paused?0:dt);
  if(scene===scOut)updatePool(PL.pos.x,PL.pos.z);
  renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
